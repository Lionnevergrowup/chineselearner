<style>
/* Self-hosted fonts, see fonts/LICENSE-*.txt and fonts/OFL-*.txt.
   ZhKai: AR PL KaitiM GB (Arphic Public License), cut down to the characters on this page by tools/build_fonts.py.
   It is a textbook-style Kai script and the same design the stroke-order data (hanzi/) was made from.
   Andika is designed for beginning readers: single-story a and g, as in pinyin books. */
@font-face{font-family:'ZhKai';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/kai.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2')}
:root{
  --ink:#3a2440; --ink-soft:#6d5a72; --line:#f0d6cf;
  --bg1:#ffe2cf; --bg2:#fff8e6;
  --purple:#7b4ff0; --purple-d:#5a33c9;
  --pink:#ff5fa2;   --pink-d:#d63f80;
  --orange:#ff9f1c; --orange-d:#d27a00;
  --yellow:#ffd23f; --yellow-d:#dcae00;
  --green:#22c07a;  --green-d:#15965c;
  --blue:#1f6fe0;   --blue-d:#1552b0;
  --teal:#18b8c9;   --teal-d:#0e8f9c;
  --red:#e8453c;    --red-d:#b72a23;
  --gold:#f5b700;   --gold-d:#c28f00;
  --emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji';
  --font-ui:'Fredoka','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Micro Hei',system-ui,sans-serif,var(--emoji);
  --font-han:'ZhKai','Kaiti SC','STKaiti','KaiTi','KaiTi_GB2312','BiauKai','AR PL UKai CN',serif,var(--emoji);
  --font-py:'Andika','Fredoka','Trebuchet MS',system-ui,sans-serif,var(--emoji);
  --font-emoji:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji','Twemoji Mozilla',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--font-ui);color:var(--ink);
  background-color:#fff0e2;
  background-image:
    radial-gradient(ellipse 160px 60px at 12% 9%,rgba(255,255,255,.85) 60%,transparent 61%),
    radial-gradient(ellipse 110px 44px at 18% 6%,rgba(255,255,255,.85) 60%,transparent 61%),
    radial-gradient(ellipse 190px 64px at 86% 16%,rgba(255,255,255,.75) 60%,transparent 61%),
    radial-gradient(ellipse 120px 46px at 80% 12%,rgba(255,255,255,.75) 60%,transparent 61%),
    linear-gradient(180deg,var(--bg1) 0%,#ffeedd 50%,var(--bg2) 100%);
  background-attachment:fixed;
  -webkit-user-select:none;user-select:none;overflow-x:hidden;
  -webkit-touch-callout:none;   /* no "Copy / Look Up" pop-up when a child long-presses */
  overscroll-behavior-y:contain; /* a downward swipe must not reload the page (Android pull-to-refresh) */
}
html{overscroll-behavior-y:contain}
/* no zooming: only scrolling, no pinch, no double-tap (manipulation, which stops double-taps, is the fallback for older
   browsers); Safari starts afresh in boxes that scroll, so they are listed too */
html,body,.table-wrap,.overlay{touch-action:manipulation;touch-action:pan-x pan-y}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.han{font-family:var(--font-han);font-weight:400}
.pyf{font-family:var(--font-py);font-weight:700}
.sound-card .pic,.word-card .wpic,.quiz-pic,.spell-pic,.sent-pic,.trace-top .tp,.big-star,.hero-lion,.char-card .pic,
.mascot .lion,.act-card .ic,.brand .logo,.lesson-btn .sticker,.sticker-slot .st,.icon-btn,.listen,.spark,.tone-card .pic{font-family:var(--font-emoji)}
#app{
  min-height:100vh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(118px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}

/* ---------- buttons ---------- */
.btn{
  --c:var(--purple);--d:var(--purple-d);
  font-weight:600;font-size:clamp(1.1rem,3.4vw,1.35rem);border:0;border-radius:20px;padding:.55em 1.1em;min-height:58px;
  color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.4em;
  transition:transform .08s,box-shadow .08s;text-shadow:0 1px 0 rgba(0,0,0,.15)
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.btn.green{--c:var(--green);--d:var(--green-d)} .btn.blue{--c:var(--blue);--d:var(--blue-d)}
.btn.orange{--c:var(--orange);--d:var(--orange-d)} .btn.pink{--c:var(--pink);--d:var(--pink-d)}
.btn.teal{--c:var(--teal);--d:var(--teal-d)} .btn.red{--c:var(--red);--d:var(--red-d)}
/* bright backgrounds get dark text so it stays readable (WCAG contrast) */
.btn.green,.btn.orange,.btn.pink,.btn.teal{color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35)}
.btn.white{--c:#fff;--d:var(--line);color:var(--ink);text-shadow:none}
.btn.big{font-size:clamp(1.3rem,4.2vw,1.7rem);min-height:68px;padding:.5em 1.4em}
.icon-btn{
  flex:none;width:56px;height:56px;border-radius:50%;border:0;background:#fff;box-shadow:0 5px 0 var(--line);
  font-size:1.6rem;cursor:pointer;display:grid;place-items:center;transition:transform .08s,box-shadow .08s;padding:0
}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.topbar h1{margin:0}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-size:clamp(1.5rem,5vw,2.3rem);font-weight:700;min-width:0}
.brand .logo{font-size:1.25em;animation:bob 3s ease-in-out infinite}
.brand-btn{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%;overflow:hidden;border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;border-radius:14px}
.brand-btn:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.brand .name{font-family:var(--font-han);background:linear-gradient(90deg,var(--red),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;letter-spacing:.04em}
.title{flex:1;font-size:clamp(1.3rem,4.5vw,2rem);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .han{font-weight:400}
.pill{flex:none;background:#fff;border-radius:999px;padding:.3em .8em;font-weight:700;font-size:1.25rem;box-shadow:0 4px 0 var(--line);white-space:nowrap}

/* ---------- home ---------- */
.section-title{font-size:clamp(1.05rem,3vw,1.3rem);font-weight:700;margin:20px 4px 10px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:16px 14px}
.lesson-btn{
  --c:var(--purple);--d:var(--purple-d);
  position:relative;aspect-ratio:1/1;min-height:100px;border-radius:30px;border:0;background:var(--c);box-shadow:0 7px 0 var(--d);color:#fff;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;transition:transform .08s,box-shadow .08s
}
.lesson-btn:active{transform:translateY(4px);box-shadow:0 3px 0 var(--d)}
.lesson-btn .num{font-size:clamp(2rem,6vw,2.6rem);font-weight:700;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.lesson-btn .letters{font-weight:700;font-size:1.15rem;background:rgba(0,0,0,.2);border-radius:999px;padding:0 .55em;margin-top:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
.lesson-btn .letters.han{font-weight:400;font-size:1.2rem}
.lesson-btn .letters.pyf{font-size:1.05rem}
.lesson-btn .letters.small{font-size:.92rem}
.dots{display:flex;gap:3px;margin-top:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35)}
.dots i.on{background:#fff}
.lesson-btn.ink{color:var(--ink)}
.lesson-btn.ink .num{text-shadow:0 2px 0 rgba(255,255,255,.35)}
.lesson-btn.ink .letters{background:rgba(255,255,255,.4)}
.lesson-btn.ink .dots i{background:rgba(58,36,64,.22)}
.lesson-btn.ink .dots i.on{background:var(--ink)}
.lesson-btn .sticker{position:absolute;top:-12px;right:-8px;font-size:2.1rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));animation:bob 2.6s ease-in-out infinite}
.lesson-btn.next{animation:pulse 1.6s ease-in-out infinite}
.lesson-btn.next::after{content:'▶';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-size:.8rem;border-radius:999px;padding:2px 8px;box-shadow:0 3px 0 var(--yellow-d)}

/* ---------- lesson ---------- */
.lesson-hero{background:#fff;border-radius:30px;box-shadow:0 7px 0 var(--line);padding:16px;margin-bottom:22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.hero-sounds{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.hero-chip{font-family:var(--font-py);font-weight:700;font-size:clamp(2rem,7vw,2.8rem);line-height:1.1;min-width:68px;padding:.2em .4em;border:0;border-radius:18px;background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);cursor:pointer}
.hero-chip.han{font-family:var(--font-han);font-weight:400;padding:.12em .3em .18em}
.hero-focus{font-size:1.15rem;color:var(--ink-soft);font-weight:600}
.hero-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px}
.act-card{
  --c:var(--purple);
  position:relative;border:0;border-radius:28px;background:#fff;box-shadow:0 7px 0 var(--line);padding:18px 10px 14px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform .08s,box-shadow .08s
}
.act-card:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.act-card .ic{font-size:2.8rem;width:86px;height:86px;border-radius:50%;background:var(--c);display:grid;place-items:center;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.act-card .nm{font-size:1.3rem;font-weight:700}
.act-card .step{position:absolute;top:10px;left:12px;width:30px;height:30px;border-radius:50%;background:#fbefe9;color:var(--ink-soft);font-weight:700;display:grid;place-items:center}
.act-card .check{position:absolute;top:6px;right:10px;font-size:1.7rem}
.act-card.done{background:#effff6;box-shadow:0 7px 0 #aee8cb}
.act-card.next{animation:pulse 1.6s ease-in-out infinite}

/* ---------- activity ---------- */
.act-title{font-size:clamp(1.1rem,3.6vw,1.6rem);font-weight:700;white-space:nowrap}
.progress{flex:1;min-width:60px;height:22px;background:#fff;border-radius:999px;box-shadow:inset 0 2px 5px rgba(0,0,0,.12);overflow:hidden}
.progress>i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--yellow),var(--orange));transition:width .45s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:10px 0 4px;min-height:58vh}
.listen{width:88px;height:88px;border-radius:50%;border:0;background:var(--blue);box-shadow:0 7px 0 var(--blue-d);font-size:2.6rem;cursor:pointer;animation:pulse 2s ease-in-out infinite;flex:none}
.listen:active{transform:translateY(4px);box-shadow:0 3px 0 var(--blue-d)}
.cards{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}

/* pinyin sound card: the letters, a picture, and the key word */
.sound-card{
  width:clamp(124px,24vw,180px);aspect-ratio:3/4;border-radius:28px;background:#fff;border:0;box-shadow:0 8px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer
}
.sound-card .glyph{font-family:var(--font-py);font-size:clamp(3rem,9.5vw,4.6rem);font-weight:700;line-height:1.05;color:var(--purple)}
.sound-card .glyph.init{color:var(--blue)}
.sound-card .pic{font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.2}
.sound-card .kw{font-size:1.15rem;color:var(--ink-soft);display:flex;align-items:flex-end;gap:2px}
.sound-card .kw .rt{font-size:1.5rem}
.sound-card .kw .rb .p{font-size:.42em}
.cards.many{gap:12px}
.cards.many .sound-card,.cards.many .char-card{width:clamp(96px,21vw,150px);aspect-ratio:4/5}
.cards.many .sound-card .glyph{font-size:clamp(2.2rem,7.5vw,3.6rem)}
.cards.many .sound-card .pic,.cards.many .char-card .pic{font-size:clamp(1.6rem,5.5vw,2.4rem)}
.cards.many .char-card .zi{font-size:clamp(2.8rem,9vw,4.2rem)}
.seen{background:#f1fff7!important;box-shadow:0 8px 0 #a3e6c4!important}

/* character card: pinyin, the character, a picture and a word */
.char-card{
  width:clamp(124px,24vw,180px);aspect-ratio:3/4;border-radius:28px;background:#fff;border:0;box-shadow:0 8px 0 var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;padding:6px
}
.char-card .py{font-family:var(--font-py);font-weight:700;font-size:clamp(1.05rem,3.4vw,1.4rem);color:var(--red-d);line-height:1.2}
.char-card .zi{font-family:var(--font-han);font-size:clamp(3.4rem,11vw,5rem);line-height:1.08}
.char-card .pic{font-size:clamp(1.8rem,5.5vw,2.5rem);line-height:1.2;min-height:1.2em}
.char-card .wd{font-family:var(--font-han);font-size:clamp(1.05rem,3.4vw,1.35rem);color:var(--ink-soft)}

/* ruby-style text: pinyin over each character */
.rt{display:inline-flex;flex-wrap:wrap;align-items:flex-end;justify-content:center}
.rb{display:inline-flex;flex-direction:column;align-items:center;line-height:1}
.rb .p{font-family:var(--font-py);font-weight:400;font-size:.36em;line-height:1.25;color:var(--ink-soft);white-space:nowrap;min-height:1.25em}
.rb .c{font-family:var(--font-han);font-weight:400;line-height:1.12}
.rb.pun .c{min-width:.55em}
.nopy .rb .p{display:none}

.balloons{display:flex;flex-wrap:wrap;gap:clamp(10px,3vw,30px);justify-content:center;padding:10px 0 40px}
.balloon{
  --c:var(--pink);position:relative;width:clamp(92px,19vw,138px);height:clamp(112px,23vw,168px);border:0;cursor:pointer;
  border-radius:50% 50% 47% 47%/56% 56% 44% 44%;color:#fff;font-family:var(--font-py);font-weight:700;font-size:clamp(2.2rem,7.5vw,3.5rem);
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.75) 0 7%,transparent 8%),var(--c);
  box-shadow:inset -8px -12px 0 rgba(0,0,0,.13);text-shadow:0 3px 0 rgba(0,0,0,.18);animation:float 3.2s ease-in-out infinite
}
.balloon.han{font-family:var(--font-han);font-weight:400;font-size:clamp(2.8rem,9vw,4.2rem)}
.balloon.long{font-size:clamp(1.7rem,5.6vw,2.6rem)}
.balloon::before{content:'';position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:8px solid transparent;border-bottom:10px solid var(--c);border-top:0}
.balloon::after{content:'';position:absolute;left:50%;top:100%;margin-top:1px;width:2px;height:40px;background:#a990a0}
.balloon.pop{animation:pop .35s ease-out forwards}
.balloon.ink{color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.4)}

.choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.choice{
  font-family:var(--font-py);font-size:clamp(2rem,7.5vw,3.2rem);font-weight:700;min-width:clamp(118px,25vw,200px);padding:.2em .5em;
  border:0;border-radius:24px;background:#fff;box-shadow:0 7px 0 var(--line);cursor:pointer
}
.choice.han{font-family:var(--font-han);font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem)}
.choice .rt{font-size:1em}
.choice.right{background:#d9ffe9;box-shadow:0 7px 0 #7fdcaa}
.quiz-pic{font-size:clamp(3.5rem,12vw,5.5rem);height:1.2em;line-height:1.2;opacity:0;transform:scale(.4);transition:.3s cubic-bezier(.2,1.6,.4,1)}
.quiz-pic.show{opacity:1;transform:none}
.quiz-han{font-family:var(--font-han);font-size:clamp(4rem,14vw,6.5rem);line-height:1.05;background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line);padding:.05em .3em .12em;min-width:1.4em;text-align:center}
.quiz-py{font-family:var(--font-py);font-weight:700;font-size:clamp(2.6rem,9vw,4rem);line-height:1.15;background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line);padding:.1em .5em;color:var(--red-d)}

/* syllables, built from a sound before and after: b + ā */
.syl{font-family:var(--font-py);font-weight:700;font-size:clamp(2.4rem,9vw,4.2rem);line-height:1.1;display:inline-flex;letter-spacing:.02em}
.syl .pt{display:inline-block;transition:transform .15s,color .15s;border-radius:10px;padding:0 .02em}
.syl .pt.i{color:var(--blue)}
.syl .pt.m{color:var(--teal-d)}
.syl .pt.f{color:var(--red)}
.syl .pt.lit{transform:translateY(-8px) scale(1.15);color:var(--pink)}
.syl.whole .pt{color:var(--purple)}
.word-card{
  border:0;border-radius:28px;background:#fff;box-shadow:0 8px 0 var(--line);padding:12px 20px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-width:clamp(130px,26vw,190px)
}
.word-card .arrow{font-size:1.4rem;color:#b35c00;font-weight:700}
.word-card .wpic{font-size:2.2rem;min-height:1.2em;line-height:1.2}
.word-card .wz{font-family:var(--font-han);font-size:1.6rem;color:var(--ink-soft);line-height:1.2}
.word-card .rt{font-size:clamp(2.4rem,8vw,3.4rem)}
.word-card .rt .rb.lit .c{color:var(--pink);transform:translateY(-6px) scale(1.12)}
.word-card .rt .rb .c{transition:transform .15s,color .15s}
.word-card .rt.whole .c{color:var(--purple)}

/* tones */
.tone-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,720px)}
.tone-card{border:0;border-radius:24px;background:#fff;box-shadow:0 7px 0 var(--line);padding:10px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tone-card .ts{font-family:var(--font-py);font-weight:700;font-size:clamp(2rem,7vw,3.2rem);line-height:1.15}
.tone-card svg{width:70%;max-width:90px;height:auto}
.tone-card .tn{font-size:clamp(.9rem,2.8vw,1.1rem);font-weight:700;color:var(--ink-soft)}
.tone-card.t1{--tc:#e8453c}.tone-card.t2{--tc:#ff9f1c}.tone-card.t3{--tc:#22a06b}.tone-card.t4{--tc:#1f6fe0}
.tone-card .ts{color:var(--tc)}
.tone-card svg path{stroke:var(--tc)}
.rhyme{font-family:var(--font-han);font-size:clamp(1.3rem,4.4vw,1.9rem);background:#fff;border-radius:20px;box-shadow:0 5px 0 var(--line);padding:.3em .9em;text-align:center;line-height:1.5}
.rhyme span{display:inline-block;white-space:nowrap}

/* blending board: b + ā = bā */
.blend-box{display:flex;flex-direction:column;align-items:center;gap:16px;background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);padding:18px 22px;min-width:min(100%,380px)}
.blend-eq{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.blend-eq .op{font-size:clamp(1.8rem,6vw,2.6rem);font-weight:700;color:var(--ink-soft)}
.bpart{font-family:var(--font-py);font-weight:700;font-size:clamp(2.4rem,9vw,4rem);line-height:1.1;min-width:1.3em;padding:.08em .3em;border:0;border-radius:18px;cursor:pointer;
  background:#eaf2ff;box-shadow:0 6px 0 #c4d8ff;color:var(--blue)}
.bpart.m{background:#e3fbf8;box-shadow:0 6px 0 #a8e9e1;color:var(--teal-d)}
.bpart.f{background:#ffecea;box-shadow:0 6px 0 #ffc6c1;color:var(--red)}
.bpart:active{transform:translateY(3px)}
.bres{font-family:var(--font-py);font-weight:700;font-size:clamp(2.6rem,10vw,4.4rem);line-height:1.1;min-width:2.2em;padding:.06em .3em;border-radius:18px;border:4px dashed #e5c7bf;color:transparent;text-align:center}
.bres.full{border-style:solid;border-color:var(--green);color:var(--purple);animation:pop-in .3s}
.blend-pic{font-size:clamp(2.6rem,9vw,3.6rem);min-height:1.2em;line-height:1.2;display:flex;align-items:center;gap:.25em}
.blend-pic .han{font-size:.9em}

/* spelling and building */
.spell-pic{font-size:clamp(3.5rem,12vw,5rem);line-height:1.1;min-height:1.1em}
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.slots .op{font-size:2rem;font-weight:700;color:var(--ink-soft)}
.slot{
  min-width:clamp(64px,15vw,96px);height:clamp(72px,17vw,104px);padding:0 .15em;border-radius:18px;border:4px dashed #e2bfb6;background:rgba(255,255,255,.65);
  font-family:var(--font-py);font-size:clamp(2.2rem,8vw,3.4rem);font-weight:700;display:grid;place-items:center
}
.slot.han{font-family:var(--font-han);font-weight:400;font-size:clamp(2.6rem,9vw,3.8rem)}
.slot.filled{border-style:solid;border-color:var(--green);background:#fff;animation:pop-in .25s}
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:680px}
.tile{
  min-width:clamp(64px,15vw,96px);height:clamp(64px,15.5vw,94px);padding:0 .2em;border-radius:18px;border:0;background:var(--yellow);box-shadow:0 7px 0 var(--yellow-d);
  font-family:var(--font-py);font-size:clamp(2rem,7.5vw,3.2rem);font-weight:700;cursor:pointer
}
.tile.han{font-family:var(--font-han);font-weight:400;font-size:clamp(2.4rem,8.5vw,3.6rem)}
.tile.init{background:#bcd6ff;box-shadow:0 7px 0 #8fb6f5}
.tile.fin{background:#ffc9c3;box-shadow:0 7px 0 #f29a91}
.tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--yellow-d)}
.tile.used{visibility:hidden}
.miss-word{background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line);padding:6px 26px}
.gap-box{display:inline-block;min-width:1.05em;border:4px dashed #e2bfb6;border-radius:14px;color:transparent;text-align:center}
.gap-box.found{border-style:solid;border-color:var(--green);color:var(--green-d);animation:pop-in .25s}
.compose{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-family:var(--font-han);font-size:clamp(3rem,11vw,4.6rem);background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--line);padding:.05em .4em .12em}
.compose .op{font-family:var(--font-ui);font-size:.55em;color:var(--ink-soft);font-weight:700}

/* sentence */
.sent-pic{font-size:clamp(3.5rem,12vw,5rem);line-height:1.1}
.sent-pic.small{font-size:clamp(2.6rem,9vw,3.6rem)}
.sentence{display:flex;flex-wrap:wrap;gap:12px 10px;justify-content:center;align-items:flex-end;font-size:clamp(2rem,7vw,3.2rem);max-width:920px}
.wchip{background:#fff;border:0;border-radius:16px;padding:.06em .22em .1em;box-shadow:0 5px 0 var(--line);font:inherit;cursor:pointer;transition:transform .12s,background .12s;color:var(--ink)}
.wchip.hl{background:var(--yellow);box-shadow:0 5px 0 var(--yellow-d);transform:translateY(-5px)}
.wchip.used{visibility:hidden}
.wchip.on{background:#ece4ff;box-shadow:0 5px 0 var(--purple)}
.wslot{display:inline-flex;align-items:flex-end;justify-content:center;min-height:1.6em;border:4px dashed #e2bfb6;border-radius:16px;background:rgba(255,255,255,.55);padding:0 .15em;text-align:center}
.wslot.filled{border-style:solid;border-color:var(--green);background:#fff;animation:pop-in .25s}
.wtext{display:inline-flex;align-items:flex-end;padding:.06em 0}
.pun{font-family:var(--font-han);align-self:flex-end;line-height:1.12}

/* tracing pinyin letters on four lines */
.trace-top{display:flex;align-items:center;gap:12px;font-weight:700;font-size:clamp(1.3rem,4vw,1.8rem)}
.trace-top .tp{font-size:clamp(2.2rem,7vw,3rem)}
.trace-top .tl{font-family:var(--font-py)}
.trace-top .count{margin-left:6px;font-family:var(--font-ui);font-size:1.05rem;background:#fff;border-radius:999px;padding:.15em .7em;box-shadow:0 3px 0 var(--line);color:var(--ink-soft)}
.trace-wrap{position:relative;width:min(100%,760px);height:clamp(230px,50vh,520px);background:#fff;border-radius:30px;box-shadow:0 8px 0 var(--line);overflow:hidden;touch-action:none}
.trace-wrap canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none}
.trace-wrap.win{box-shadow:0 8px 0 #7fdcaa,0 0 0 6px #b8f5d4}

/* writing characters stroke by stroke in a 田 grid */
.write-top{display:flex;align-items:center;gap:12px;font-size:clamp(1.2rem,4vw,1.7rem);font-weight:700}
.write-top .rt{font-size:clamp(2.4rem,7vw,3rem)}
.write-top .count{font-size:1.05rem;background:#fff;border-radius:999px;padding:.15em .7em;box-shadow:0 3px 0 var(--line);color:var(--ink-soft)}
.grid-box{position:relative;width:min(86vw,52vh,380px);height:min(86vw,52vh,380px);background:#fff;border-radius:22px;box-shadow:0 8px 0 var(--line);touch-action:none;overflow:hidden}
.grid-box svg.grid{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.grid-box .hw{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:none}
.grid-box.win{box-shadow:0 8px 0 #7fdcaa,0 0 0 6px #b8f5d4}
.grid-box .loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.2rem;color:var(--ink-soft)}
.stroke-dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:380px}
.stroke-dots i{width:14px;height:14px;border-radius:50%;background:#f3e3de}
.stroke-dots i.on{background:var(--green)}

/* drawing */
.draw-tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.swatch{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:0 3px 0 var(--line),inset 0 0 0 1px rgba(0,0,0,.18);cursor:pointer;padding:0;
  display:grid;place-items:center;color:#fff;font-size:1.3rem;font-weight:700;transition:transform .12s}
.swatch.light{color:var(--ink)}
.swatch.on{outline:4px solid var(--ink);outline-offset:2px;transform:scale(1.12)}
.swatch.on::after{content:'✓'}
.tool{width:48px;height:48px;border-radius:14px;border:0;background:#fff;box-shadow:0 4px 0 var(--line);font-size:1.4rem;cursor:pointer;display:grid;place-items:center;padding:0}
.tool.on{background:#ece4ff;outline:3px solid var(--purple)}
.tool .dot{display:block;border-radius:50%;background:var(--ink)}
.stage.compact{gap:14px;justify-content:flex-start}
.draw-wrap{position:relative;width:min(100%,820px);height:clamp(210px,44vh,470px);background:#fff;border-radius:26px;box-shadow:0 8px 0 var(--line);overflow:hidden;touch-action:none}
.draw-wrap canvas{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.draw-label{position:absolute;left:50%;top:85%;transform:translate(-50%,-50%);white-space:nowrap;border:0;margin:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;
  font-family:var(--font-han);font-size:clamp(1.7rem,5.2vw,2.4rem);line-height:1.35;color:var(--red-d);background:rgba(255,255,255,.85);border-radius:14px;padding:0 .4em}
.draw-label[hidden]{display:none}
.draw-label.dragging{cursor:grabbing;box-shadow:0 6px 14px rgba(0,0,0,.18)}
.draw-label .x{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font:700 12px/22px var(--font-ui);text-align:center}
.word-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.word-bank .wchip{font-family:var(--font-han);font-size:clamp(1.4rem,4.2vw,1.9rem)}
.word-bank.nudge{animation:shake .5s 2}

/* stickers */
.sticker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.sticker-slot{border:0;border-radius:26px;background:rgba(255,255,255,.6);box-shadow:0 6px 0 var(--line);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.sticker-slot .st{font-size:3.4rem;line-height:1.1;filter:grayscale(1) opacity(.35)}
.sticker-slot.got{background:#fff}
.sticker-slot.got .st{filter:none}
.sticker-slot .lb{font-weight:600;color:var(--ink-soft)}

/* parents */
.panel-card{background:#fff;border-radius:24px;box-shadow:0 6px 0 var(--line);padding:18px 20px;margin-bottom:18px;-webkit-user-select:text;user-select:text}
.panel-card h2{margin:0 0 10px;font-size:1.35rem}
.panel-card p,.panel-card li{font-size:1.05rem;line-height:1.65;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}
.panel-card .note{color:var(--ink-soft)}
.version{font-size:.95rem;color:var(--ink-soft);text-align:center;margin:18px 0 6px}
.update-slot{display:flex;justify-content:center;margin:4px 0 12px}
.update-slot:empty{display:none}
.panel-card ul{padding-left:1.2em;margin:6px 0}
.seg{display:inline-flex;flex-wrap:wrap;gap:8px}
.seg button{border:0;border-radius:14px;padding:.45em .9em;font-size:1.05rem;font-weight:600;background:#fbefe9;cursor:pointer;min-height:44px}
.seg button.on{background:var(--purple);color:#fff}
.setting{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0}
.setting>label{font-weight:600;min-width:150px}
.check-btn{border:0;background:none;font-size:1.5rem;line-height:1;padding:6px 10px;border-radius:10px;cursor:pointer;min-width:48px;min-height:44px}
.check-btn:hover,.check-btn:focus-visible{background:#fbefe9}
.check-btn.hand{box-shadow:inset 0 0 0 2px #e9cfff}
input,textarea{-webkit-user-select:text;user-select:text}
.gate{display:flex;flex-direction:column;align-items:center;gap:10px;margin:6px 0 14px}
.gate label{font-weight:600;font-size:1.15rem}
.gate input{font:inherit;font-size:1.8rem;font-weight:700;width:5em;text-align:center;padding:.2em;border:3px solid var(--line);border-radius:14px;color:var(--ink)}
.gate input:focus{outline:none;border-color:var(--purple)}
.gate .err{color:var(--red-d);font-weight:600;min-height:1.3em}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.prog{border-collapse:collapse;width:100%;min-width:560px;font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,'Segoe UI',sans-serif}
table.prog th,table.prog td{padding:7px 8px;border-bottom:1px solid #f6e6e0;text-align:center;font-size:.98rem}
table.prog th{background:#fff6f2;position:sticky;top:0}
table.prog td.l{text-align:left}
table.prog td.l small{color:var(--ink-soft)}
table.prog td.na{color:#ccb8b2}

/* mascot */
.mascot{transition-property:none!important;position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));display:flex;align-items:flex-end;gap:8px;z-index:30;pointer-events:none;max-width:calc(100% - 20px)}
.mascot .lion{font-size:clamp(52px,12vw,70px);line-height:1;pointer-events:auto;cursor:pointer;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.18));background:none;border:0;padding:0}
.mascot.talking .lion{animation:talk .28s ease-in-out infinite alternate}
.mascot .bubble{
  position:relative;background:#fff;border-radius:22px;padding:10px 16px;margin-bottom:24px;max-width:min(560px,calc(100vw - 110px));
  font-size:clamp(1.05rem,3.3vw,1.35rem);font-weight:600;box-shadow:0 4px 0 var(--line);opacity:0;transform:translateY(8px) scale(.96);transition:.25s
}
.mascot .bubble .pyf{font-weight:700}
.mascot .bubble.show{opacity:1;transform:none}
.mascot .bubble::before{content:'';position:absolute;left:-10px;bottom:12px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.mascot .lion{touch-action:none;-webkit-user-drag:none}
.mascot.dragging .lion{animation:none;transform:scale(1.18) rotate(-6deg);cursor:grabbing;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.mascot.flip{flex-direction:row-reverse}
.mascot.flip .bubble::before{left:auto;right:-10px;border:10px solid transparent;border-left-color:#fff;border-right:0}
.mascot.top{align-items:flex-start}
.mascot.top .bubble{margin-bottom:0;margin-top:14px}
.mascot.top .bubble::before{bottom:auto;top:12px}

/* overlays */
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(58,36,64,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .2s;overflow-y:auto}
.overlay .panel{background:#fff;border-radius:34px;padding:26px 22px 24px;text-align:center;max-width:520px;width:100%;box-shadow:0 12px 0 rgba(0,0,0,.14);animation:pop-in .4s cubic-bezier(.2,1.6,.4,1)}
.overlay h1{margin:6px 0 4px;font-size:clamp(1.9rem,6vw,2.6rem)}
.overlay p{margin:0 0 18px;font-size:1.25rem;color:var(--ink-soft);font-weight:600}
.overlay .row{flex-direction:column}
.overlay .row .btn{width:100%}
.big-star{font-size:clamp(5rem,20vw,7rem);line-height:1;display:inline-block;animation:spin-in .9s cubic-bezier(.2,1.4,.4,1)}
.splash{background:linear-gradient(180deg,#ffe2cf,#fff8e6)}
.splash .panel{background:transparent;box-shadow:none}
.splash .hero-lion{font-size:clamp(7rem,30vw,11rem);line-height:1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
.splash h1{font-family:var(--font-han);font-weight:400;font-size:clamp(3rem,13vw,5rem);margin:6px 0;background:linear-gradient(90deg,var(--red),var(--pink),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.06em}

/* effects */
.confetti{position:fixed;top:-24px;width:12px;height:18px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}
.spark{position:fixed;z-index:70;pointer-events:none;font-size:1.7rem;transform:translate(-50%,-50%);animation:spark .85s ease-out forwards}
.shake{animation:shake .45s!important}
.bounce{animation:bounce .45s}
.hint{animation:glow .9s ease-in-out infinite!important}
.fade{opacity:.2;pointer-events:none;transition:opacity .3s}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes talk{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.06)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes pop{40%{transform:scale(1.3)}100%{transform:scale(0);opacity:0}}
@keyframes pop-in{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes bounce{0%,100%{transform:scale(1)}40%{transform:scale(1.12) translateY(-6px)}70%{transform:scale(.96)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.95),0 7px 0 var(--yellow-d);transform:scale(1)}50%{box-shadow:0 0 0 12px rgba(255,210,63,0),0 7px 0 var(--yellow-d);transform:scale(1.08)}}
@keyframes spin-in{from{transform:rotate(-200deg) scale(0)}to{transform:none}}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes spark{to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.4);opacity:0}}

@media (max-width:560px){
  .act-head .act-title .nm{display:none}
  .act-grid{grid-template-columns:repeat(2,1fr);gap:16px 12px}
  .lesson-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 10px}
  .lesson-btn{min-height:0}   /* three across fit even a 320px screen */
  .icon-btn{width:46px;height:46px;font-size:1.3rem}
  .topbar{gap:7px}
  .brand .logo{display:none}
  .brand{font-size:1.5rem}
  .brand .name{overflow:hidden;text-overflow:ellipsis}
  .panel-card{padding:14px 12px}
  table.prog{min-width:0}
  table.prog th,table.prog td{padding:5px 3px;font-size:.8rem}
  table.prog th{font-size:.72rem}
  table.prog td.l{font-size:.85rem;overflow-wrap:anywhere}
  .check-btn{min-width:36px;padding:6px 3px;font-size:1.3rem}
  .pill{font-size:1.05rem;padding:.3em .6em}
  .tone-cards{gap:8px}
}
/* phones held sideways and other short screens */
@media (max-height:520px){
  #app{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .topbar{margin-bottom:6px}
  .icon-btn{width:44px;height:44px;font-size:1.25rem}
  .progress{height:16px}
  .stage{min-height:0;gap:10px;padding:2px 0}
  .stage.compact{gap:8px}
  .btn{min-height:46px;font-size:1.05rem;padding:.35em .9em}
  .btn.big{min-height:50px;font-size:1.2rem}
  .listen{width:58px;height:58px;font-size:1.7rem}
  .mascot .lion{font-size:42px}
  .mascot .bubble{font-size:.9rem;padding:6px 12px;margin-bottom:10px;max-width:min(440px,52vw)}
  .trace-top,.write-top{display:none}
  .trace-wrap{height:calc(100vh - 142px);height:calc(100dvh - 142px);min-height:160px}
  .grid-box{width:min(60vw,calc(100dvh - 150px),300px);height:min(60vw,calc(100dvh - 150px),300px)}
  .draw-tools{gap:5px}
  .swatch{width:32px;height:32px;border-width:3px}
  .tool{width:36px;height:36px;font-size:1.1rem}
  .draw-wrap{height:calc(100vh - 176px);height:calc(100dvh - 176px);min-height:140px}
  .word-bank .wchip{font-size:1.2rem}
  .slot{min-width:52px;height:62px;font-size:2rem}
  .tile{min-width:52px;height:56px;font-size:1.9rem}
  .spell-pic,.sent-pic,.sent-pic.small{font-size:2.4rem}
  .quiz-pic{font-size:2.6rem}
  .quiz-han{font-size:3rem}
  .sentence{font-size:1.7rem;gap:8px}
  .balloons{padding:4px 0 34px}
  .balloon{width:88px;height:106px;font-size:2.1rem}
  .balloon.han{font-size:2.6rem}
  .sound-card,.char-card{width:104px}
  .sound-card .glyph{font-size:2.4rem}
  .char-card .zi{font-size:2.8rem}
  .word-card{padding:8px 16px 6px}
  .word-card .rt{font-size:2rem}
  .syl{font-size:2.2rem}
  .blend-box{padding:12px 18px;gap:8px}
  .bpart{font-size:2.2rem}
  .bres{font-size:2.4rem}
  .choice{font-size:2rem}
  .tone-card .ts{font-size:1.8rem}

const TONED = {a:'āáǎà', o:'ōóǒò', e:'ēéěè', i:'īíǐì', u:'ūúǔù', 'ü':'ǖǘǚǜ'};
const UNTONE = {};
for (const [v, marks] of Object.entries(TONED)) [...marks].forEach((m, k) => { UNTONE[m] = [v, k + 1]; });
// tone of a syllable (5 = neutral) and the syllable without its mark
const toneOf = s => { for (const c of s) if (UNTONE[c]) return UNTONE[c][1]; return 5; };
const plain = s => [...s].map(c => UNTONE[c] ? UNTONE[c][0] : c).join('');
// put tone t on a plain syllable: on a or e, on the o of ou, otherwise on the last vowel (liù, guǐ)
function withTone(base, t){
  if (t < 1 || t > 4) return base;
  const chars = [...base];
  let i = chars.indexOf('a');
  if (i < 0) i = chars.indexOf('e');
  if (i < 0 && base.includes('ou')) i = chars.indexOf('o');
  if (i < 0) for (let k = chars.length - 1; k >= 0; k--) if (TONED[chars[k]]){ i = k; break; }
  if (i < 0) return base;
  chars[i] = TONED[chars[i]][t - 1];
  return chars.join('');
}
// finals taught as one unit; a three-part syllable is initial + i/u/ü + one of these (g-u-ā)
const FINALS = new Set(['a','o','e','i','u','ü','ai','ei','ui','ao','ou','iu','ie','üe','er','an','en','in','un','ün','ang','eng','ing','ong']);
// read as a whole, not blended
const WHOLE = new Set(['zhi','chi','shi','ri','zi','ci','si','yi','wu','yu','ye','yue','yuan','yin','yun','ying']);
const INI_SORTED = [...INITIALS].sort((a, b) => b.length - a.length);
// bā → {ini:'b', med:'', fin:'ā', finKey:'ā'} · xué → {ini:'x', fin:'üé'} (ü written u after j q x y) · guā → {ini:'g', med:'u', fin:'ā'}
function splitSyl(s){
  const p = plain(s), t = toneOf(s);
  const ini = INI_SORTED.find(x => p.startsWith(x) && p.length > x.length) || '';
  let rest = p.slice(ini.length);
  if ('jqxy'.includes(ini) && ini && rest[0] === 'u') rest = 'ü' + rest.slice(1);
  let med = '', fin = rest;
  if (!FINALS.has(rest) && 'iuü'.includes(rest[0]) && FINALS.has(rest.slice(1))){ med = rest[0]; fin = rest.slice(1); }
  return {ini, med, fin:withTone(fin, t), finBase:fin, tone:t, whole:WHOLE.has(p)};
}

// pinyin units of a syllable for highlighting: the written letters split into initial / medial / final
function sylParts(s){
  const {ini, med, whole} = splitSyl(s);
  if (whole || (!ini && !med)) return [['w', s]];
  const out = [];
  if (ini) out.push(['i', ini]);
  let rest = s.slice(ini.length);
  if (med){ out.push(['m', rest.slice(0, 1)]); rest = rest.slice(1); }
  out.push(['f', rest]);
  return out;
}
const sylSpeech = s => {   // b · ā · bā (for a whole syllable just the syllable)
  const {ini, med, fin, whole} = splitSyl(s);
  if (whole || !ini) return [s];
  return [SND(ini), ...(med ? [SOUND[med].say] : []), fin, s];
};

const hard = r => r >= 2;
// Question types take turns: the first round is the easiest type, then the type used least so far (never twice in a row).
function typePlan(n, types){
  const used = Object.fromEntries(types.map(t => [t, 0])), plan = [];
  for (let r = 0; r < n; r++){
    const free = types.filter(t => t !== plan[r - 1]);
    const min = Math.min(...free.map(t => used[t]));
    const t = r === 0 ? types[0] : (free.length ? pick(free.filter(x => used[x] === min)) : types[0]);
    plan.push(t); used[t]++;
  }
  return plan;
}

// A shuffled list of length clamp(items, min, max) with no back-to-back repeats.
function roundList(items, min, max){
  const n = Math.max(min, Math.min(max, items.length));
  let list = [];
  while (list.length < n) list.push(...shuffle(items));
  list = list.slice(0, n);
  for (let i = 1; i < list.length; i++){
    if (list[i] === list[i - 1] && items.length > 1){
      const j = list.findIndex((x, k) => k > i && x !== list[i] && list[k - 1] !== list[i]);
      if (j > 0) [list[i], list[j]] = [list[j], list[i]];
    }
  }
  return list;
}

  file: phrase => CLIPS[norm(phrase)] || null,
  url(phrase){ const f = this.file(phrase); return f ? (this.blobs.get(f) || 'audio/' + f) : null; },
  // Fetch clips in the background so they play instantly later (first = jump the queue).
  preload(phrases, first){
    const add = [];
    for (const ph of phrases){ const f = this.file(ph); if (f && !this.blobs.has(f) && !add.includes(f)) add.push(f); }
    this.queue = first ? [...add, ...this.queue.filter(f => !add.includes(f))] : [...this.queue, ...add.filter(f => !this.queue.includes(f))];
    const pump = () => {
      while (this.loading < 6 && this.queue.length){
        const f = this.queue.shift();
        if (this.blobs.has(f)) continue;
        this.loading++;
        fetch('audio/' + f).then(r => r.ok ? r.blob() : Promise.reject(r.status))
          .then(b => { this.blobs.set(f, URL.createObjectURL(new Blob([b], {type:'audio/mpeg'}))); })
          .catch(() => {})
          .finally(() => { this.loading--; pump(); });
      }
    };
    pump();
  },
  stopNow(){
    const a = this.audio;
    if (a){ a.onended = a.onerror = null; try { a.pause(); } catch (e) {} }
    if (this.tts) try { speechSynthesis.cancel(); } catch (e) {}
    if (this.halt){ const f = this.halt; this.halt = null; f(); }
  },
  stop(){ this.gen++; this.stopNow(); Music.duck(false); },
  // parts: a phrase or a list of phrases, spoken one after another
  speak(parts, opts = {}){
    const gen = ++this.gen;
    this.stopNow();
    const list = (Array.isArray(parts) ? parts : [parts]).map(norm).filter(Boolean);
    if (window.__spoken && list.length && audioUnlocked) window.__spoken.push(list.join(' ')); // test hook
    if (list.length && audioUnlocked) Music.duck(true);   // music goes quiet while 乐乐 talks
    return (async () => {
      try {
        for (let i = 0; i < list.length; i++){
          if (gen !== this.gen || !audioUnlocked) return;
          if (i) await wait(170);
          if (gen !== this.gen) return;
          await this.one(list[i], opts, gen);
        }
      } finally { if (gen === this.gen) Music.duck(false); }
    })();
  },
  async one(phrase, opts, gen){
    if (window.__fastSpeech){ if (!this.file(phrase) && window.__clipMiss) window.__clipMiss.push(phrase); await wait(5); return; }   // test hook
    const url = this.url(phrase);
    if (url && await this.clip(url, opts, gen)) return;
    if (gen !== this.gen) return;
    if (!url && window.__clipMiss) window.__clipMiss.push(phrase);
    await this.say(phrase, opts, gen);
  },
  rate: opts => Math.max(0.6, Math.min(1.5, (opts.rate || 1) * state.settings.rate)),
  clip(url, opts, gen){
    return new Promise(resolve => {
      const a = this.audio;
      let over = false, timer = null;
      const end = ok => { if (over) return; over = true; clearTimeout(timer); a.onended = a.onerror = null; if (this.halt === stopFn) this.halt = null; resolve(ok); };
      const stopFn = () => end(true);
      if (gen !== this.gen){ resolve(true); return; }
      this.halt = stopFn;
      a.onended = () => end(true);
      a.onerror = () => { this.last = 'error'; end(false); };
      a.onplaying = () => { this.last = 'ok'; };
      try {
        a.src = url;
        const r = this.rate(opts);
        a.defaultPlaybackRate = r; a.playbackRate = r;
        const pr = a.play();
        // iOS can refuse audio again after a call or time in the background; the next tap unlocks it
        if (pr && pr.catch) pr.catch(err => { if (err && err.name === 'NotAllowedError'){ this.blocked = true; this.last = 'blocked'; } end(false); });
      } catch (e) { end(false); return; }
      timer = setTimeout(() => end(true), 15000);
    });
  },
  // fallback: the browser's built-in speech
  say(text, opts, gen){
    return new Promise(resolve => {
      if (!this.tts){ resolve(); return; }
      let over = false, timer = null;
      const fin = () => { if (over) return; over = true; clearTimeout(timer); if (this.halt === fin) this.halt = null; resolve(); };
      const start = () => {
        if (gen !== this.gen){ fin(); return; }
        const u = new SpeechSynthesisUtterance(text);
        if (this.voice){ u.voice = this.voice; u.lang = this.voice.lang; } else u.lang = 'zh-CN';
        u.volume = 1;
        u.rate = Math.max(0.5, Math.min(1.4, (opts.rate || 1) * state.settings.rate * 0.9));
        u.pitch = 1.08;
        u.onend = fin; u.onerror = fin;
        this.current = u; // keep a reference: some browsers drop events for collected utterances
        this.halt = fin;
        try { speechSynthesis.speak(u); if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) { fin(); return; }
        timer = setTimeout(fin, 2500 + text.length * 300 / u.rate);
      };
      if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(start, 70); }
      else start();
    });
  },
};
// a tiny silent WAV, played inside the first tap to unlock audio
const SILENT_WAV = (() => {
  const n = 800, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const str = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); v.setUint32(4, 36 + n, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true);
  v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); str(36, 'data'); v.setUint32(40, n, true);
  for (let i = 0; i < n; i++) v.setUint8(44 + i, 128);
  return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
})();

/* ---------- sound effects (Web Audio, no files needed) ---------- */
const Sfx = {
  ctx: null,
  ensure(){
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) try { this.ctx = new AC(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, dur, o = {}){
    if (!state.settings.sfx || !audioUnlocked) return;
    const c = this.ensure(); if (!c) return;
    try {
    const t = c.currentTime + (o.when || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime((o.vol || 0.18) * 2, t + 0.015);   // phones play quietly
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t); osc.stop(t + dur + 0.05);
    } catch (e) {}
  },
  tap(){ this.tone(700, 0.06, {type:'triangle', vol:0.1}); },
  tick(k){ this.tone(520 + k * 90, 0.08, {type:'triangle', vol:0.1}); },
  // the pentatonic scale (do re mi sol la): a little Chinese tune for every right answer
  good(){ [523, 587, 659, 784].forEach((f, i) => this.tone(f, 0.2, {type:'triangle', when:i * 0.08, vol:0.15})); },
  bad(){ this.tone(300, 0.28, {type:'sine', slide:170, vol:0.16}); },
  pop(){ this.tone(420, 0.1, {type:'square', slide:1400, vol:0.07}); },
  stroke(){ this.tone(880, 0.07, {type:'triangle', vol:0.08}); },
  win(){ [523, 587, 659, 784, 880, 1047].forEach((f, i) => this.tone(f, 0.28, {type:'triangle', when:i * 0.09, vol:0.14})); },
};

/* ---------- background music: audio/music.mp3, an original loop made by tools/make_music.py ---------- */
const Music = {
  buf: null, src: null, master: null, loading: null, ducked: false, undock: null,
  level(){ return this.ducked ? 0.06 : 0.22; },
  load(){
    const c = Sfx.ensure();
    if (!c || this.buf) return null;
    if (!this.loading) this.loading = fetch('audio/music.mp3?v=' + AUDIO_VERSION.music).then(r => r.ok ? r.arrayBuffer() : Promise.reject(r.status))
      .then(ab => new Promise((res, rej) => c.decodeAudioData(ab, res, rej)))
      .then(b => { this.buf = b; }).catch(() => {}).then(() => { this.loading = null; });
    return this.loading;
  },
  start(){
    if (!state.settings.music || !audioUnlocked || document.hidden || this.src) return;
    const c = Sfx.ensure(); if (!c) return;
    if (!this.buf){ const p = this.load(); if (p) p.then(() => { if (this.buf) this.start(); }); return; }
    try {
      if (!this.master){ this.master = c.createGain(); this.master.gain.value = this.level(); this.master.connect(c.destination); }
      const g = c.createGain(), s = c.createBufferSource();
      s.buffer = this.buf; s.loop = true; s.connect(g); g.connect(this.master);
      g.gain.setValueAtTime(0, c.currentTime); g.gain.linearRampToValueAtTime(1, c.currentTime + 1.5);
      s.start();
      this.src = {s, g};
    } catch (e) {}
  },
  stop(){
    const cur = this.src, c = Sfx.ctx;
    if (!cur || !c) return;
    this.src = null;
    try {
      cur.g.gain.cancelScheduledValues(c.currentTime); cur.g.gain.setValueAtTime(cur.g.gain.value, c.currentTime);
      cur.g.gain.linearRampToValueAtTime(0, c.currentTime + 0.4);
      cur.s.stop(c.currentTime + 0.45);
    } catch (e) {}
  },
  duck(on){
    clearTimeout(this.undock);
    if (on){ if (!this.ducked){ this.ducked = true; this.fade(0.15); } }
    else if (this.ducked) this.undock = setTimeout(() => { this.ducked = false; this.fade(0.9); }, 350);
  },
  fade(secs){
    const c = Sfx.ctx; if (!c || !this.master) return;
    try { const g = this.master.gain, t = c.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(this.level(), t + secs); } catch (e) {}
  },
};
function setMusic(on){
  state.settings.music = on; saveState();
  if (on) Music.start(); else Music.stop();
}

function burst(el){
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let k = 0; k < 10; k++){
    const ang = k / 10 * Math.PI * 2, dist = 60 + Math.random() * 60;

// Run fn once 乐乐 has finished talking (and at least minMs has passed), unless the child has left the screen.
function afterSay(spoken, minMs, fn){
  const id = navId;
  Promise.all([spoken, wait(minMs)]).then(() => { if (id === navId) fn(); });
}
// Call fn when el changes size.
function watchSize(el, fn){
  if (window.ResizeObserver){ const ro = new ResizeObserver(fn); ro.observe(el); cleanups.push(() => ro.disconnect()); }
  else { window.addEventListener('resize', fn); cleanups.push(() => window.removeEventListener('resize', fn)); }
}
// Finger or mouse strokes on a canvas. Only the first finger draws, so a resting palm or a second finger is ignored.
// positions are relative to `rel` (the element itself unless given)
function onStrokes(el, {down, move, up}, rel = el){
  el.addEventListener('contextmenu', e => e.preventDefault());
  const pos = e => { const r = rel.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
  if (window.PointerEvent){
    let id = null;
    el.addEventListener('pointerdown', e => {
      if (id !== null || down(pos(e)) === false) return;
      id = e.pointerId; e.preventDefault();
      try { el.setPointerCapture(id); } catch (err) {}
    });
    el.addEventListener('pointermove', e => {
      if (e.pointerId !== id) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      for (const ev of (evs.length ? evs : [e])) move(pos(ev));
    });
    const stop = e => { if (e.pointerId !== id) return; id = null; up(); };
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    return;
  }
  // older iPads (iOS < 13) have touch events only
  let tid = null, mouse = false;
  const find = e => { for (let i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === tid) return e.changedTouches[i]; return null; };
  el.addEventListener('touchstart', e => {
    const t = e.changedTouches[0];
    if (tid !== null || down(pos(t)) === false) return;
    tid = t.identifier; e.preventDefault();
  }, {passive:false});
  el.addEventListener('touchmove', e => { const t = find(e); if (t){ e.preventDefault(); move(pos(t)); } }, {passive:false});
  const tend = e => { if (find(e)){ tid = null; up(); } };
  el.addEventListener('touchend', tend);
  el.addEventListener('touchcancel', tend);
  el.addEventListener('mousedown', e => { if (down(pos(e)) !== false) mouse = true; });
  const mm = e => { if (mouse) move(pos(e)); }, mu = () => { if (mouse){ mouse = false; up(); } };
  window.addEventListener('mousemove', mm); window.addEventListener('mouseup', mu);
  cleanups.push(() => { window.removeEventListener('mousemove', mm); window.removeEventListener('mouseup', mu); });
}
function replayAnim(el, cls){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  const off = e => { if (e.target !== el) return; el.classList.remove(cls); el.removeEventListener('animationend', off); };
  el.addEventListener('animationend', off);
}
const wiggle = el => replayAnim(el, 'shake');
function reveal(btn){ btn.hidden = false; requestAnimationFrame(() => { try { btn.scrollIntoView({behavior:'smooth', block:'nearest'}); } catch (e) {} }); }
const bounce = el => replayAnim(el, 'bounce');

/* ---------- mascot (乐乐 the lion) ---------- */
let lastSay = null, sayCount = 0, bubbleTimer = null;
const bubbleEl = h('div', {class:'bubble', 'aria-live':'polite'});
let leoDragged = false;
const lionEl = h('button', {class:'lion', 'aria-label':'乐乐：点一点再听一遍，按住可以拖动', onclick:() => {
  if (leoDragged) return;   // that was a drag, not a tap
  if (lastSay) say(lastSay.text, lastSay.speech);
}}, '🦁');
const mascotEl = h('aside', {class:'mascot', 'aria-label':'小狮子乐乐'}, lionEl, bubbleEl);
document.body.append(mascotEl);

// Put 乐乐 at (x, y) = his top-left corner; his bubble opens towards the side with more room.
let leoAt = null;   // where he was last put (measuring him mid-move can lag a frame behind)
function placeLeo(x, y, save){
  const lw = lionEl.offsetWidth || 64, lh = lionEl.offsetHeight || 64, vw = innerWidth, vh = innerHeight;
  x = Math.max(4, Math.min(vw - lw - 4, x));
  y = Math.max(4, Math.min(vh - lh - 4, y));
  const right = x + lw / 2 > vw / 2, low = y + lh / 2 > vh / 2;
  const st = mascotEl.style;
  mascotEl.classList.add('moved');
  mascotEl.classList.toggle('flip', right);
  mascotEl.classList.toggle('top', !low);
  if (right){ st.left = 'auto'; st.right = (vw - x - lw) + 'px'; } else { st.right = 'auto'; st.left = x + 'px'; }
  if (low){ st.top = 'auto'; st.bottom = (vh - y - lh) + 'px'; } else { st.bottom = 'auto'; st.top = y + 'px'; }
  leoAt = {x, y};
  if (save){ state.settings.leo = {fx:(x + lw / 2) / vw, fy:(y + lh / 2) / vh}; saveState(); }
}
function restoreLeo(){
  const p = state.settings.leo;
  if (p && isFinite(p.fx) && isFinite(p.fy)) placeLeo(p.fx * innerWidth - (lionEl.offsetWidth || 64) / 2, p.fy * innerHeight - (lionEl.offsetHeight || 64) / 2, false);
}
function putLeoBack(){
  state.settings.leo = null; saveState();
  mascotEl.classList.remove('moved', 'flip', 'top');
  ['left', 'right', 'top', 'bottom'].forEach(k => { mascotEl.style[k] = ''; });
  bounce(lionEl);
}
(() => {
  let drag = null;
  const begin = (id, cx, cy) => { const r = lionEl.getBoundingClientRect(); drag = {id, cx, cy, x:r.left, y:r.top, moved:false}; };
  const moveTo = (cx, cy) => {
    if (!drag) return false;
    const dx = cx - drag.cx, dy = cy - drag.cy;
    if (!drag.moved && Math.hypot(dx, dy) < 8) return false;   // small wobble = still a tap
    if (!drag.moved){ drag.moved = true; mascotEl.classList.add('dragging'); }
    placeLeo(drag.x + dx, drag.y + dy, false);
    return true;
  };
  const finish = () => {
    if (!drag) return;
    if (drag.moved){
      leoDragged = true; setTimeout(() => { leoDragged = false; }, 60);
      mascotEl.classList.remove('dragging');
      if (leoAt) placeLeo(leoAt.x, leoAt.y, true);
      Sfx.pop(); bounce(lionEl);
    }
    drag = null;
  };
  if (window.PointerEvent){
    lionEl.addEventListener('pointerdown', e => { begin(e.pointerId, e.clientX, e.clientY); try { lionEl.setPointerCapture(e.pointerId); } catch (err) {} });
    lionEl.addEventListener('pointermove', e => { if (drag && e.pointerId === drag.id && moveTo(e.clientX, e.clientY)) e.preventDefault(); });
    lionEl.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) finish(); });
    lionEl.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.id) finish(); });
  } else {   // older iPads
    lionEl.addEventListener('touchstart', e => { const t = e.changedTouches[0]; begin(t.identifier, t.clientX, t.clientY); }, {passive:true});
    lionEl.addEventListener('touchmove', e => { const t = e.changedTouches[0]; if (moveTo(t.clientX, t.clientY)) e.preventDefault(); }, {passive:false});
    lionEl.addEventListener('touchend', finish);
    lionEl.addEventListener('touchcancel', finish);
  }
  window.addEventListener('resize', restoreLeo);
  restoreLeo();
})();
// text = what the bubble shows, speech = what 乐乐 says (so answers are never shown as text)
// With “显示乐乐说的话” on, the bubble shows exactly what 乐乐 says, so the game can be played with the sound off.
const caption = speech => (Array.isArray(speech) ? speech : [speech]).map(norm).filter(Boolean).join(' ');
function say(text, speech){
  lastSay = {text, speech};
  const my = ++sayCount;
  bubbleEl.textContent = state.settings.captions && speech != null ? caption(speech) : text;
  bubbleEl.classList.add('show');
  mascotEl.classList.add('talking');
  clearTimeout(bubbleTimer);
  return Speech.speak(speech == null ? text : speech)
    .then(() => {
      if (my !== sayCount) return;
      mascotEl.classList.remove('talking');
      if (!state.settings.captions) bubbleTimer = setTimeout(() => { if (my === sayCount) bubbleEl.classList.remove('show'); }, 6000);
    });
}

function later(fn, ms){ const id = navId; const t = setTimeout(() => { if (id === navId) fn(); }, ms); timers.push(t); return t; }

function route(){
  resetScope();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'lesson' && LESSON_BY_N[+parts[1]]){
    const l = LESSON_BY_N[+parts[1]];
    const a = parts[2] && actsOf(l).find(x => x.key === parts[2]);

const actName = (l, a) => ACT_INFO[a.key](l)[0];
const actIcon = (l, a) => ACT_INFO[a.key](l)[1];
const actsOf = l => ACTS.filter(a => a.when(l));
const isDone = (n, k) => !!(state.done[n] && state.done[n][k]);
const doneCount = l => actsOf(l).filter(a => isDone(l.n, a.key)).length;
const lessonComplete = l => doneCount(l) === actsOf(l).length;
const totalStars = () => LESSONS.reduce((t, l) => t + doneCount(l), 0);
const PARENT_CHECK = [['认读',['cards','tones']],['书写',['trace','write']],['拼读·词语',['blend','read','words']],['句子',['sentence']]];

const LIGHT_BG = new Set(['var(--pink)', 'var(--green)', 'var(--orange)', 'var(--teal)', 'var(--gold)', 'var(--yellow)']);
const UNIT_COLORS = {1:['var(--red)','var(--red-d)'], 2:['var(--purple)','var(--purple-d)'], 3:['var(--blue)','var(--blue-d)'], 4:['var(--teal)','var(--teal-d)'],
  5:['var(--green)','var(--green-d)'], 6:['var(--orange)','var(--orange-d)'], 7:['var(--pink)','var(--pink-d)'], 8:['var(--gold)','var(--gold-d)']};
const lessonColor = l => UNIT_COLORS[l.unit];
const lessonLabel = l => l.label || l.title;
const isPinyinText = t => /^[a-zü… ]+$/.test(t);

const starPill = () => h('div', {class:'pill', 'aria-label':'星星'}, '⭐ ', totalStars());
const backBtn = hash => h('button', {class:'icon-btn', 'aria-label':'返回', onclick:() => { Sfx.tap(); go(hash); }}, '⬅️');
const listenBtn = fn => h('button', {class:'listen', 'aria-label':'听一听', onclick:() => { Sfx.tap(); fn(); }}, '🔊');

function showHome(quiet){
  const next = LESSONS.find(l => !lessonComplete(l));
  mount(
    h('header', {class:'topbar'},
      h('h1', {class:'brand'}, h('button', {class:'brand-btn', 'aria-label':'中文乐园：回到开始页面', title:'开始页面',
        onclick:() => { Sfx.tap(); go('#/start'); }}, h('span', {class:'logo', 'aria-hidden':'true'}, '🦁'), h('span', {class:'name'}, '中文乐园'))),
      starPill(),
      h('button', {class:'icon-btn', 'aria-label':'我的贴纸', onclick:() => { Sfx.tap(); go('#/stickers'); }}, '🏆'),
      h('button', {class:'icon-btn', 'aria-label':'家长', onclick:() => { Sfx.tap(); go('#/parents'); }}, '👪'),
      h('button', {class:'icon-btn', 'aria-label':'更新到最新版本', title:'更新', onclick:() => forceRefresh()}, '🔄')),
    updateSlot,
    UNITS.map(([u, name, icon]) => [
      h('h2', {class:'section-title'}, `${icon} 第${cn(u)}单元 · ${name}`),
      h('div', {class:'lesson-grid'}, LESSONS.filter(l => l.unit === u).map(l => lessonBtn(l, l === next))),
    ]),
    h('div', {class:'row', style:{marginTop:'28px'}},
      h('button', {class:'btn white', onclick:() => { Sfx.tap(); go('#/start'); }}, '🏁 开始页面'),
      musicButton()),
    h('p', {class:'version'}, versionText())
  );
  if (quiet) return;
  const line = next && next.n > 1 ? P.playLesson(next.n) : T.pickLesson;
  say(line + ' 👆', line);
}

function musicButton(){
  const label = () => state.settings.music ? '🎵 音乐：开' : '🔇 音乐：关';
  const b = h('button', {class:'btn white', 'aria-pressed':String(!!state.settings.music), onclick:() => {
    Sfx.tap(); setMusic(!state.settings.music);
    b.textContent = label(); b.setAttribute('aria-pressed', String(!!state.settings.music));
  }}, label());
  return b;
}

// The first screen (“中文乐园 ▶ 开始”). Shown when the game opens, and at #/start.
function showStart(){
  if (/^#\/start/.test(location.hash)) showHome(true);   // the home screen waits underneath
  overlay([
    h('div', {class:'hero-lion'}, '🦁'),
    h('h1', {}, '中文乐园'),
    h('p', {}, '跟小狮子乐乐学拼音、认汉字 · 一年级上册 32 课'),
    h('p', {style:{fontSize:'1.05rem', margin:'-8px 0 16px'}}, '🔊 请打开声音！'),
    h('div', {class:'row'}, h('button', {class:'btn green big', style:{fontSize:'2rem', minHeight:'84px'}, onclick:() => {
      audioUnlocked = true; Speech.unlock(); Sfx.ensure(); Sfx.win(); Music.start();
      closeOverlay();
      Speech.preload([...Object.values(T), ...PRAISE, ...TRY]);
      // from the start screen, 开始 leads to the home screen
      if (/^#\/start/.test(location.hash)) try { history.replaceState(null, '', location.pathname + location.search + '#/'); } catch (e) { location.hash = '#/'; }
      const greet = location.hash.length > 2 ? null : T.greet;
      if (greet) say(T.greetShow, greet).then(() => { if (lastSay && lastSay.speech === greet) route(); });
      else route();
    }}, '▶ 开始')),
    h('p', {class:'version'}, versionText()),
  ], 'splash');
}

function lessonBtn(l, isNext){
  const [c, d] = lessonColor(l);
  const acts = actsOf(l), cnt = doneCount(l), label = lessonLabel(l);
  const status = cnt === acts.length ? '，已完成' : cnt ? `，完成了${cnt}个，共${acts.length}个` : '';
  const py = isPinyinText(label);
  return h('button', {class:'lesson-btn' + (isNext ? ' next' : '') + (LIGHT_BG.has(c) ? ' ink' : ''), style:{'--c':c, '--d':d}, 'aria-label':`第${l.n}课：${l.book} ${l.title}${status}`,
      onclick:() => { Sfx.tap(); go('#/lesson/' + l.n); }},
    h('span', {class:'num'}, l.n),
    h('span', {class:'letters ' + (py ? 'pyf' : 'han') + (label.length > 4 && !py ? ' small' : '')}, label),
    h('span', {class:'dots'}, acts.map(a => h('i', {class:isDone(l.n, a.key) ? 'on' : null}))),
    lessonComplete(l) ? h('span', {class:'sticker'}, STICKERS[l.n - 1][0]) : null);
}

// read the lesson's texts aloud, one after another
function readLessonText(l){
  const texts = l.sentences.map(s => cleanText(s[0]));
  say(texts.join(''), [T.readText, ...texts]);
}

function showLesson(l){
  const acts = actsOf(l), next = acts.find(a => !isDone(l.n, a.key));
  const chips = l.kind === 'py'
    ? l.sounds.map(s => h('button', {class:'hero-chip', 'aria-label':'听 ' + s, onclick:e => { Sfx.tap(); bounce(e.currentTarget); say(`${s}  ${SOUND[s].pic}`, [SND(s), SOUND[s].ph]); }}, s))
    : l.chars.map(x => h('button', {class:'hero-chip han', 'aria-label':'听 ' + x[0], onclick:e => { Sfx.tap(); bounce(e.currentTarget); say(`${x[0]} ${x[1]}`, charSay(x)); }}, x[0]));
  mount(
    h('header', {class:'topbar'}, backBtn('#/'), h('h1', {class:'title'}, `第${l.n}课 · `, h('span', {class:isPinyinText(l.title) ? 'pyf' : 'han'}, l.title)), starPill()),
    h('section', {class:'lesson-hero'},
      h('div', {class:'hero-sounds'}, chips),
      h('div', {class:'hero-focus'}, `${l.book} · 第${cn(l.unit)}单元`),
      h('div', {class:'hero-row'},
        h('button', {class:'btn white', onclick:() => { Sfx.tap(); readLessonText(l); }}, '📖 听一听'))),
    h('div', {class:'act-grid'}, acts.map((a, i) => {
      const done = isDone(l.n, a.key);
      return h('button', {class:'act-card' + (done ? ' done' : '') + (a === next ? ' next' : ''), style:{'--c':ACT_INFO[a.key](l)[2]}, 'aria-label':`${i + 1}. ${actName(l, a)}${done ? '，已完成' : ''}`,
          onclick:() => { Sfx.tap(); go(`#/lesson/${l.n}/${a.key}`); }},
        h('span', {class:'step'}, i + 1),
        done ? h('span', {class:'check'}, '✅') : null,
        h('span', {class:'ic'}, actIcon(l, a)),
        h('span', {class:'nm'}, actName(l, a)));
    }))
  );
  Speech.preload(lessonPhrases(l), true);
  if (next) say(`第${cn(l.n)}课！点 ${actIcon(l, next)} ${actName(l, next)}。`, [P.lesson(l.n), P.playAct(actName(l, next))]);
  else say(`你学完了第${cn(l.n)}课！🎉 再玩一次吗？`, [P.finished(l.n), T.playAgain]);
}

function showActivity(l, a){
  const bar = h('i');
  const stage = h('div', {class:'stage'});
  const id = navId;
  const ctx = {
    lesson:l, stage, replay:null,
    alive: () => id === navId,
    progress: f => { bar.style.width = Math.round(Math.max(0, Math.min(1, f)) * 100) + '%'; },
    done: () => { if (id === navId) finishActivity(l, a); },
  };
  Speech.preload(lessonPhrases(l), true);
  mount(
    h('header', {class:'topbar act-head'},
      backBtn('#/lesson/' + l.n),
      h('h1', {class:'act-title', 'aria-label':`第${l.n}课：${actName(l, a)}`}, actIcon(l, a), ' ', h('span', {class:'nm'}, actName(l, a))),
      h('div', {class:'progress', role:'progressbar', 'aria-label':'进度'}, bar),
      h('button', {class:'icon-btn', 'aria-label':'再听一遍', onclick:() => { Sfx.tap(); if (ctx.replay) ctx.replay(); }}, '🔊')),
    stage);
  a.run(ctx);
}

function finishActivity(l, a){
  const first = !isDone(l.n, a.key);
  (state.done[l.n] = state.done[l.n] || {})[a.key] = true;
  saveState();
  Sfx.win(); confetti(60);
  const acts = actsOf(l), idx = acts.indexOf(a);
  const nextAct = acts.slice(idx + 1).find(x => !isDone(l.n, x.key)) || acts.slice(0, idx).find(x => !isDone(l.n, x.key));
  const nextLesson = LESSON_BY_N[l.n + 1];
  if (first && lessonComplete(l)){
    const [emo, name] = STICKERS[l.n - 1];
    overlay([
      h('div', {class:'big-star'}, emo),
      h('h1', {}, '这一课学完啦！'),
      h('p', {}, P.gotSticker(name)),
      h('div', {class:'row'},
        nextLesson ? h('button', {class:'btn green big', onclick:() => go('#/lesson/' + nextLesson.n)}, `第${nextLesson.n}课 ➜`) : null,
        h('button', {class:'btn pink', onclick:() => go('#/stickers')}, '🏆 我的贴纸'),
        h('button', {class:'btn white', onclick:() => go('#/')}, '🏠 首页')),
    ]);
    say(`太棒了！你学完了第${cn(l.n)}课！🎉`, [T.hooray, P.finished(l.n), P.gotSticker(name)]);
    confetti(80);
    return;
  }
  overlay([
    h('div', {class:'big-star'}, '⭐'),
    h('h1', {}, pick(PRAISE)),
    h('p', {}, first ? '你得到了一颗星星！' : '你又完成了一次！'),
    h('div', {class:'row'},
      nextAct ? h('button', {class:'btn green big', onclick:() => go(`#/lesson/${l.n}/${nextAct.key}`)}, actIcon(l, nextAct), ' ', actName(l, nextAct), ' ➜')
              : (nextLesson ? h('button', {class:'btn green big', onclick:() => go('#/lesson/' + nextLesson.n)}, `第${nextLesson.n}课 ➜`) : null),
      h('button', {class:'btn white', onclick:() => go('#/lesson/' + l.n)}, `📚 第${l.n}课`)),
  ]);
  say(first ? T.earnedStar + ' ⭐' : T.greatJob, first ? [T.greatJob, T.earnedStar] : T.greatJob);
}

function showStickers(){
  const count = LESSONS.filter(lessonComplete).length;
  mount(
    h('header', {class:'topbar'}, backBtn('#/'), h('h1', {class:'title'}, `🏆 我的贴纸  ${count}/${LESSONS.length}`), starPill()),
    h('div', {class:'sticker-grid'}, LESSONS.map(l => {
      const got = lessonComplete(l);
      const [emo, name] = STICKERS[l.n - 1];
      return h('button', {class:'sticker-slot' + (got ? ' got' : ''), 'aria-label':`第${l.n}课的贴纸：${got ? name : '还没有得到'}`, onclick:e => {
          Sfx.tap(); bounce(e.currentTarget);
          if (got) say(P.aSticker(name) + ' 🎉', P.aSticker(name)); else say(P.finishFor(l.n));
        }},
        h('span', {class:'st'}, got ? emo : '❔'), h('span', {class:'lb'}, `第${l.n}课`));
    })));
  say(count ? P.haveStickers(count) + ' 🎉' : T.finishALesson, count ? P.haveStickers(count) : T.finishALesson);
}

const soundStatus = h('span', {class:'note', role:'status'});
// Play a test line and report what happened, so a parent can tell why there is no sound.
function soundCheck(){
  Sfx.good();
  soundStatus.textContent = '正在检查……';
  Speech.last = null;
  const clips = Object.keys(CLIPS).length;
  Speech.speak(T.readingVoice);
  setTimeout(() => {
    const r = Speech.last;
    soundStatus.textContent =
      !clips ? '⚠️ 语音文件没有加载。请点首页右上角的 🔄 更新。'
      : r === 'ok' ? '✅ 乐乐的声音正在播放。如果听不到，请把音量调大，并检查是否连接了蓝牙耳机或音箱。'
      : r === 'blocked' ? '⚠️ 浏览器暂时不让播放声音。请先点一下页面，再试一次。'
      : r === 'error' ? '⚠️ 有一个语音文件没有加载。请检查网络，再点 🔄 更新。'
      : '⚠️ 声音没有开始播放。如果是在微信里打开的，请点右上角“…”，选“在浏览器打开”。';
  }, 2200);
}

function showParents(){
  soundStatus.textContent = '';
  const seg = (name, options, cur, onPick) => {
    const wrap = h('div', {class:'seg', role:'radiogroup', 'aria-label':name});
    options.forEach(([label, val]) => wrap.append(h('button', {class:val === cur ? 'on' : null, role:'radio', 'aria-checked':String(val === cur), onclick:e => {
      [...wrap.children].forEach(b => { b.classList.toggle('on', b === e.currentTarget); b.setAttribute('aria-checked', String(b === e.currentTarget)); });
      onPick(val);
    }}, label)));
    return wrap;
  };
  // A box is ticked automatically when the child finishes the activities; a tap sets it by hand.
  const checkBtn = (l, name, keys) => {
    const own = keys.filter(k => actsOf(l).some(a => a.key === k));
    if (!own.length) return h('span', {class:'na', title:'这一课没有这一项'}, '—');
    const auto = own.every(k => isDone(l.n, k));
    const mine = state.check[l.n] || {};
    const hand = Object.prototype.hasOwnProperty.call(mine, name);
    const on = hand ? !!mine[name] : auto;
    const b = h('button', {class:'check-btn' + (hand ? ' hand' : ''), 'aria-pressed':String(on), 'aria-label':`第${l.n}课 ${name}：${on ? '已勾选' : '未勾选'}`,
      title: hand ? '这是您勾的，点一下可以改。' : (auto ? '孩子在游戏里完成了，点一下可以改。' : '点一下打勾'),
      onclick:() => {
        Sfx.tap();
        (state.check[l.n] = state.check[l.n] || {})[name] = !on;
        saveState();
        b.replaceWith(checkBtn(l, name, keys));
      }}, on ? '✅' : '⬜');
    return b;
  };
  const focusOf = l => l.kind === 'py' ? l.sounds.join(' ') : l.chars.map(x => x[0]).join(' ');
  mount(
    h('header', {class:'topbar'}, backBtn('#/'), h('h1', {class:'title'}, '👪 家长页面')),
    h('section', {class:'panel-card'},
      h('h2', {}, '使用说明'),

      h('ul', {},
        h('li', {}, '🔤 认拼音：点卡片听声母、韵母，再戳破对的气球（听音找字母、看图找声母或韵母）。'),
        h('li', {}, '👀 认汉字：点字卡听“天，天空的天”，再戳破对的气球（听音找字、看图找字、看拼音找字）。'),
        h('li', {}, '🎵 四声：听四个声调，再听一听是第几声。口诀：一声平，二声扬，三声拐弯，四声降。'),
        h('li', {}, '✏️ 描一描：在四线格里用手指描拼音字母。🖌️ 写汉字：先看笔顺动画，再在田字格里一笔一笔写，笔顺不对会提示。'),
        h('li', {}, '🧩 拼一拼：声母和韵母拼成音节（b-ā→bā），再听音拼出音节。📖 读一读 / 读词语：听一听、看图选一选、补全缺的部分。'),
        h('li', {}, '💬 读句子：跟读句子，把词语排好顺序，再找出缺的词。🎨 画一画：画一幅画，再给它选一个词，还可以保存图片。')),

// Clear all progress, after a simple sum only a grown-up can answer.
function confirmReset(){
  const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
  const input = h('input', {type:'text', inputmode:'numeric', pattern:'[0-9]*', autocomplete:'off', 'aria-label':`${a} 加 ${b} 等于几？`});
  const err = h('div', {class:'err', role:'alert'});
  const doReset = () => {
    if (input.value.trim() !== String(a + b)){
      Sfx.bad(); err.textContent = input.value.trim() ? '不对哦，再试一次。' : '请先填写答案。';
      wiggle(input); input.select(); return;
    }
    state.done = {}; state.check = {}; saveState();
    route();   // redraw the parents page with everything cleared
    overlay([
      h('div', {class:'big-star'}, '🧹'),
      h('h1', {}, '记录已清除'),
      h('p', {}, '这台设备上的星星、贴纸和勾选都已经清除了。'),
      h('div', {class:'row'}, h('button', {class:'btn green', onclick:closeOverlay}, '好的')),
    ]);
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doReset(); if (e.key === 'Escape') closeOverlay(); });
  overlay([
    h('div', {class:'big-star'}, '🗑️'),
    h('h1', {}, '清除全部学习记录？'),
    h('p', {}, '这会清除这台设备上所有的星星、贴纸和勾选，不能恢复。'),
    h('div', {class:'gate'}, h('label', {}, `请家长回答：${a} + ${b} = ?`), input, err),
    h('div', {class:'row'},
      h('button', {class:'btn red', onclick:doReset}, '🗑️ 清除'),
      h('button', {class:'btn white', onclick:() => { Sfx.tap(); closeOverlay(); }}, '取消')),
  ]);
  setTimeout(() => { try { input.focus(); } catch (e) {} }, 50);
}
