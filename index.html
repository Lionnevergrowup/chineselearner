// every character the game knows, with its card data (pinyin, word, picture)
const CHAR_INFO = {};
for (const l of LESSONS) for (const x of (l.chars || [])) if (!CHAR_INFO[x[0]]) CHAR_INFO[x[0]] = x;
// a word or a character as 乐乐 says it: one character is read as its syllable (tone exactly right)
const tokSay = tok => tok.chars.filter(([c]) => isHan(c)).length === 1 ? tokPy(tok) : tok.word;
const wordSay = (w, py) => [...w].filter(isHan).length === 1 ? py : w;

// colourful balloons for a round of choices
const BALLOON_COLORS = ['var(--pink)','var(--blue)','var(--orange)','var(--green)','var(--purple)','var(--teal)'];
function balloonRound(ctx, {opts, answer, label, cls, top, prompt, right, wrong, r, total, next}){
  let solved = false, misses = 0;
  const balloons = opts.map((o, i) => {
    const bc = BALLOON_COLORS[(i + r) % BALLOON_COLORS.length];
    const text = label ? label(o) : o;
    const b = h('button', {class:'balloon' + (cls ? ' ' + cls : '') + (String(text).length > 3 ? ' long' : '') + (LIGHT_BG.has(bc) ? ' ink' : ''),
      'aria-label':'气球 ' + text, 'data-v':o, style:{'--c':bc, animationDelay:(i * 0.4) + 's'}, onclick:e => {
      if (solved || !tapOK(e)) return;
      if (o === answer){
        solved = true; Sfx.pop(); Sfx.good(); b.classList.add('pop'); burst(b); fadeOthers(balloons, b);
        ctx.progress((r + 2) / total);
        const pr = pick(PRAISE);
        afterSay(say(pr, right(pr)), 1200, next);
      } else {
        misses++; Sfx.bad(); wiggle(b);
        say(pick(TRY), wrong(o));
        if (misses >= 2) balloons[opts.indexOf(answer)].classList.add('hint');
      }
    }}, text);
    return b;
  });
  ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), top), h('div', {class:'balloons'}, balloons));
  ctx.replay = prompt; prompt();
}

// 1 · 认拼音 / 认汉字: tap the cards, then pop the balloon
function actCards(ctx){ return ctx.lesson.kind === 'py' ? soundCards(ctx) : charCards(ctx); }

// Sound choices: the answer, look-alikes (later rounds), then the lesson's other sounds and other sounds of the same kind.
function soundChoices(target, l, r){
  const n = hard(r) ? 4 : 3, kind = isInitial(target);
  const same = s => isInitial(s) === kind && s !== target;
  const look = hard(r) ? shuffle((LOOK_PY[target] || '').split(' ').filter(s => s && SOUND[s] && same(s))).slice(0, 2) : [];
  const rest = uniq([...shuffle(l.sounds), ...shuffle(soundsUpTo(l.n)), ...shuffle(Object.keys(SOUND))]).filter(s => same(s) && !look.includes(s)
    && (hard(r) || !(LOOK_PY[target] || '').split(' ').includes(s) || l.sounds.includes(s)));
  return shuffle([target, ...look, ...rest].slice(0, n));
}
function soundCards(ctx){
  const l = ctx.lesson, targets = l.sounds;
  const order = isShort() ? roundList(targets, 3, 3) : roundList(targets, targets.length <= 2 ? 4 : 6, 6);
  const plan = typePlan(order.length, ['hear', 'pic']);
  const total = order.length + 1, seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🎈 开始 ➜');
  const cards = targets.map(s => {
    const S = SOUND[s];
    const card = h('button', {class:'sound-card', 'aria-label':s, onclick:() => {
        Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(s);
        say(T.sayWithMe + ' 🗣️', [S.say, S.ph]);
        if (seen.size === targets.length) reveal(playBtn);
      }},
      h('span', {class:'glyph' + (isInitial(s) ? ' init' : '')}, s), h('span', {class:'pic'}, S.pic), h('span', {class:'kw'}, ruby(S.w, S.wp)));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards' + (targets.length > 4 ? ' many' : '')}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(SHOW.tapEachCard, T.tapEachCard);
  ctx.replay = intro; intro();

  function round(r){
    if (r >= order.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const target = order[r], type = plan[r], S = SOUND[target];
    const opts = soundChoices(target, l, r);
    const q = isInitial(target) ? 'startsWith' : 'whichFinal';
    const ask = type === 'pic' ? [S.ph, T[q]] : [T.find, S.say];
    // the picture with the character that has the sound (广播的播: 播), without its pinyin, which would give the answer away
    const key = [...S.ph].filter(isHan).pop();
    const top = type === 'pic' ? h('div', {class:'quiz-pic show', 'aria-label':key}, S.pic, ' ', h('span', {class:'han', style:{fontSize:'.8em'}}, key)) : null;
    quizHook(type, target);
    balloonRound(ctx, {opts, answer:target, r, total,
      top, prompt: () => type === 'pic' ? say(SHOW[q], ask) : say(SHOW.popBalloon, ask),
      right: pr => [pr, S.say],
      wrong: x => [T.thatIs, SND(x), ...ask],
      next: () => round(r + 1)});
  }
}

// Character choices: the answer, look-alikes (later rounds), the lesson's other characters, then earlier ones.
function charChoices(target, l, r, ok = () => true){
  const n = hard(r) ? 4 : 3;
  const bad = c => c === target || !ok(c);
  const look = hard(r) ? shuffle([...(LOOK_ZI[target] || '')]).filter(c => !bad(c)).slice(0, 1) : [];
  const rest = uniq([...shuffle(l.chars.map(x => x[0])), ...shuffle(charsUpTo(l.n).map(x => x[0])), ...shuffle(Object.keys(CHAR_INFO))]).filter(c => !bad(c) && !look.includes(c));
  return shuffle([target, ...look, ...rest].slice(0, n));
}
function charCards(ctx){
  const l = ctx.lesson, chars = l.chars;
  const order = isShort() ? roundList(chars, 3, 3) : roundList(chars, 6, 6);
  const plan = typePlan(order.length, l.n >= 19 ? ['hear', 'pic', 'py'] : ['hear', 'pic']);
  const total = order.length + 1, seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🎈 开始 ➜');
  const cards = chars.map(x => {
    const card = h('button', {class:'char-card', 'aria-label':x[0], onclick:() => {
        Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(x[0]);
        say(T.sayWithMe + ' 🗣️', charSay(x));
        if (seen.size === chars.length) reveal(playBtn);
      }},
      h('span', {class:'py'}, x[1]), h('span', {class:'zi'}, x[0]), h('span', {class:'pic'}, x[4] || ''), h('span', {class:'wd'}, x[2]));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards' + (chars.length > 4 ? ' many' : '')}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(SHOW.tapEachCard, T.tapEachCard);
  ctx.replay = intro; intro();

  function round(r){
    if (r >= order.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const x = order[r], target = x[0];
    let type = plan[r];
    if (type === 'pic' && !x[4]) type = l.n >= 19 ? 'py' : 'hear';
    const picOK = c => !PIC_OF[c] || PIC_OF[c] !== x[4];   // never two characters with the same picture
    const opts = charChoices(target, l, r, type === 'pic' ? picOK : undefined);
    const ask = type === 'pic' ? [T.picChar] : type === 'py' ? [T.pyChar] : [T.find, charSay(x)];
    const top = type === 'pic' ? h('div', {class:'quiz-pic show'}, x[4]) : type === 'py' ? h('div', {class:'quiz-py'}, x[1]) : null;
    quizHook(type, target);
    balloonRound(ctx, {opts, answer:target, cls:'han', r, total, top,
      prompt: () => type === 'pic' ? say(SHOW.picChar, ask) : type === 'py' ? say(SHOW.pyChar, ask) : say(SHOW.popBalloon, ask),
      right: pr => [pr, charSay(x)],
      wrong: c => CHAR_INFO[c] ? [T.thatIs, charSay(CHAR_INFO[c]), ...ask] : ask,
      next: () => round(r + 1)});
  }
}

// 2 · 四声: hear the four tones, then tell which tone a syllable has
const TONE_PATH = {1:'M8 11 L52 11', 2:'M8 27 L52 8', 3:'M8 17 Q20 35 31 33 Q43 31 52 11', 4:'M8 8 L52 32'};
const toneSvg = t => {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 60 40'); svg.setAttribute('aria-hidden', 'true');
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  p.setAttribute('d', TONE_PATH[t]); p.setAttribute('fill', 'none'); p.setAttribute('stroke-width', '5'); p.setAttribute('stroke-linecap', 'round');
  svg.append(p);
  return svg;
};
const TONE_NAME = t => T['tone' + t];
// what the tones game practises: the lesson's vowels (ā á ǎ à), syllables (bā bá bǎ bà) or characters (天 tiān)
function toneItems(l){
  if (l.kind !== 'py') return l.chars.filter(x => toneOf(x[1]) <= 4 && !x[1].includes(' ')).map(x => ({base:plain(x[1]), tone:toneOf(x[1]), char:x}));
  if (l.n <= 6 || l.n >= 14) return l.sounds.map(s => ({base:plain(SND(s))}));
  return uniq(l.syll.map(([s]) => plain(s))).filter(b => !WHOLE.has(b)).map(base => ({base}));
}
function actTones(ctx){
  const l = ctx.lesson, items = toneItems(l);
  const rounds = isShort() ? 3 : 6;
  const total = rounds + 1;
  const first = items[0];
  const seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0, 0); }}, '🎵 开始 ➜');
  const cards = [1, 2, 3, 4].map(t => {
    const syl = withTone(first.base, t);
    const card = h('button', {class:'tone-card t' + t, 'aria-label':syl, onclick:() => {
      Sfx.tap(); bounce(card); card.classList.add('seen'); seen.add(t);
      say(`${syl}  ${TONE_NAME(t)}`, [syl, TONE_NAME(t)]);
      if (seen.size === 4) reveal(playBtn);
    }}, h('span', {class:'ts'}, syl), toneSvg(t), h('span', {class:'tn'}, TONE_NAME(t)));
    return card;
  });
  ctx.stage.replaceChildren(...[
    first.char ? h('div', {class:'quiz-han'}, first.char[0]) : null,
    h('div', {class:'rhyme'}, T.tonesRhyme.split('，').map((part, k, all) => h('span', {}, part + (k < all.length - 1 ? '，' : '')))),
    h('div', {class:'tone-cards'}, cards), playBtn].filter(Boolean));
  ctx.progress(0);
  const intro = () => say(T.tonesRhyme + ' 👆', [T.tonesRhyme, T.tonesTap]);
  ctx.replay = intro; intro();

  let lastTone = 0;
  function round(r){
    if (r >= rounds){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const it = items[(r + (items.length > 1 ? 1 : 0)) % items.length];
    let tone = it.tone;
    if (!tone){ const ts = [1, 2, 3, 4].filter(t => t !== lastTone); tone = pick(ts); }
    lastTone = tone;
    const answer = withTone(it.base, tone);
    const n = hard(r) ? 4 : 3;
    const tones = shuffle([tone, ...shuffle([1, 2, 3, 4].filter(t => t !== tone)).slice(0, n - 1)]);
    const opts = tones.map(t => withTone(it.base, t));
    const top = it.char ? h('div', {class:'quiz-han'}, it.char[0]) : null;
    quizHook('tone', answer);
    balloonRound(ctx, {opts, answer, r, total, top,
      prompt: () => say(SHOW.whichTone, [T.whichTone, answer]),
      right: pr => [pr, answer, TONE_NAME(tone), ...(it.char ? [charSay(it.char)] : [])],
      wrong: x => [x, TONE_NAME(toneOf(x)), T.whichTone, answer],
      next: () => round(r + 1)});
  }
}

// 3 · 描一描: trace the pinyin letters with a finger, on four lines like a pinyin exercise book
// Length of a letter's strokes: thin the letter's shape to 1-pixel lines (Zhang-Suen) and count the pixels.
function skeletonLength(alpha, w, x0, x1, y0, y1){
  const bw = x1 - x0 + 3, bh = y1 - y0 + 3, m = new Uint8Array(bw * bh);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (alpha[(y * w + x) * 4 + 3] > 128) m[(y - y0 + 1) * bw + (x - x0 + 1)] = 1;
  const del = [];
  for (let changed = true, guard = 0; changed && guard < 200; guard++){
    changed = false;
    for (let step = 0; step < 2; step++){
      del.length = 0;
      for (let y = 1; y < bh - 1; y++) for (let x = 1; x < bw - 1; x++){
        const i = y * bw + x;
        if (!m[i]) continue;
        const p = [m[i - bw], m[i - bw + 1], m[i + 1], m[i + bw + 1], m[i + bw], m[i + bw - 1], m[i - 1], m[i - bw - 1]];
        const b = p[0] + p[1] + p[2] + p[3] + p[4] + p[5] + p[6] + p[7];
        if (b < 2 || b > 6) continue;
        let a = 0; for (let k = 0; k < 8; k++) if (!p[k] && p[(k + 1) % 8]) a++;
        if (a !== 1) continue;
        if (step === 0 ? (p[0] && p[2] && p[4]) || (p[2] && p[4] && p[6]) : (p[0] && p[2] && p[6]) || (p[0] && p[4] && p[6])) continue;
        del.push(i);
      }
      if (del.length){ changed = true; for (const i of del) m[i] = 0; }
    }
  }
  let n = 0; for (let i = 0; i < m.length; i++) n += m[i];
  return n * 1.1;   // diagonal steps are a little longer than one pixel
}

function actTrace(ctx){
  const l = ctx.lesson, items = shuffle(l.sounds).slice(0, isShort() ? 3 : 6);
  let i = 0, fails = 0, won = false, drawing = false, last = null, hue = 0, travel = 0, skelLen = 1;
  const wrap = h('div', {class:'trace-wrap'});
  const guide = h('canvas', {'aria-hidden':'true'}), ink = h('canvas', {'aria-label':'描字的地方'});
  wrap.append(guide, ink);
  const topPic = h('span', {class:'tp'}), topLabel = h('span', {class:'tl'}), topWord = h('span'), counter = h('span', {class:'count'});
  const clearBtn = h('button', {class:'btn orange', onclick:() => { Sfx.tap(); clearInk(); }}, '🧽 擦掉');
  const doneBtn = h('button', {class:'btn green', onclick:() => check(true)}, '✔ 描好了');
  ctx.stage.replaceChildren(h('div', {class:'trace-top'}, topPic, topLabel, topWord, counter), wrap, h('div', {class:'row'}, clearBtn, doneBtn));

  let W = 0, H = 0, dpr = 1, gctx, ictx, brush = 20, size = 100, mask = [], tol = null, mw = 0, mh = 0, cellOf = null, cells = [];
  const small = document.createElement('canvas');
  const font = px => `700 ${px}px Andika, 'Trebuchet MS', sans-serif`;

  function layout(){
    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    for (const c of [guide, ink]){ c.width = W * dpr; c.height = H * dpr; }
    gctx = guide.getContext('2d');
    ictx = ink.getContext('2d');
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawGuide();
  }
  function drawGuide(done){
    const text = items[i];
    gctx.font = font(100);
    // the four lines are fixed by the letter shapes (h above, x in the middle, g below), so every letter sits the same way
    const asc = gctx.measureText('h').actualBoundingBoxAscent || 75;
    const desc = gctx.measureText('g').actualBoundingBoxDescent || 25;
    const xh = gctx.measureText('x').actualBoundingBoxAscent || 50;
    const wid = gctx.measureText(text).width || 60;
    size = Math.min(H * 0.8 / ((asc + desc) / 100), W * 0.84 / (wid / 100));
    const A = asc * size / 100, D = desc * size / 100, X = xh * size / 100;
    const base = (H - (A + D)) / 2 + A, cx = W / 2;
    gctx.clearRect(0, 0, W, H);
    // the middle band of the four lines
    gctx.fillStyle = '#fff6f3'; gctx.fillRect(16, base - X, W - 32, X);
    gctx.lineWidth = 3; gctx.lineCap = 'round';
    gctx.strokeStyle = '#9fc4ff'; hline(base - A); hline(base - X);
    gctx.strokeStyle = '#ff9aa8'; hline(base);
    gctx.strokeStyle = '#9fc4ff'; hline(base + D);
    // the letters to trace
    gctx.font = font(size); gctx.textAlign = 'center'; gctx.textBaseline = 'alphabetic';
    gctx.fillStyle = done ? '#bff3d8' : '#f4e6ff';
    gctx.fillText(text, cx, base);
    gctx.setLineDash([2, Math.max(6, size * 0.05)]);
    gctx.lineWidth = Math.max(3, size * 0.014); gctx.strokeStyle = done ? '#22c07a' : '#b597ee';
    gctx.strokeText(text, cx, base);
    gctx.setLineDash([]);
    // masks for checking (half resolution)
    brush = Math.max(14, size * 0.12);
    mw = Math.ceil(W / 2); mh = Math.ceil(H / 2);
    const mc = document.createElement('canvas'); mc.width = mw; mc.height = mh;
    const m = mc.getContext('2d', {willReadFrequently:true});
    m.setTransform(0.5, 0, 0, 0.5, 0, 0);
    m.font = font(size); m.textAlign = 'center'; m.textBaseline = 'alphabetic'; m.fillStyle = '#000';
    m.fillText(text, cx, base);
    const md = m.getImageData(0, 0, mw, mh).data;
    m.lineJoin = 'round'; m.lineWidth = brush + size * 0.03; m.strokeStyle = '#000';   // how far off the letter still counts
    m.strokeText(text, cx, base);
    const td = m.getImageData(0, 0, mw, mh).data;
    mask = []; tol = new Uint8Array(mw * mh);
    for (let p = 0; p < mw * mh; p++){ if (md[p * 4 + 3] > 128) mask.push(p); if (td[p * 4 + 3] > 30) tol[p] = 1; }
    // split the letters into small parts, so every part has to be traced (not just half of it)
    let x0 = mw, x1 = 0, y0 = mh, y1 = 0;
    for (const p of mask){ const x = p % mw, y = (p / mw) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const cellPx = Math.max(4, brush * 0.75);   // in mask pixels (half size), about 1.5 brush widths
    const cols = Math.max(1, Math.ceil((x1 - x0 + 1) / cellPx)), rows = Math.max(1, Math.ceil((y1 - y0 + 1) / cellPx));
    cellOf = new Int32Array(mask.length);
    const counts = new Array(cols * rows).fill(0);
    mask.forEach((p, k) => {
      const cx = Math.min(cols - 1, Math.floor((p % mw - x0) / cellPx)), cy = Math.min(rows - 1, Math.floor((Math.floor(p / mw) - y0) / cellPx));
      cellOf[k] = cx + cols * cy; counts[cellOf[k]]++;
    });
    const minPx = cellPx * cellPx * 0.08;   // ignore cells that only touch the letter's edge
    cells = counts.map(n => n >= minPx ? n : 0);
    skelLen = Math.max(1, skeletonLength(md, mw, x0, x1, y0, y1) * 2);   // in page pixels (the mask is half size)
    small.width = mw; small.height = mh;
  }
  function hline(y){ gctx.beginPath(); gctx.moveTo(16, y); gctx.lineTo(W - 16, y); gctx.stroke(); }
  function clearInk(){ travel = 0; if (ictx){ ictx.clearRect(0, 0, W, H); } }
  function measure(){
    const sc = small.getContext('2d', {willReadFrequently:true});
    sc.clearRect(0, 0, mw, mh); sc.drawImage(ink, 0, 0, mw, mh);
    const d = sc.getImageData(0, 0, mw, mh).data;
    let cov = 0, inkN = 0, out = 0;
    const hit = new Array(cells.length).fill(0);
    mask.forEach((p, k) => { if (d[p * 4 + 3] > 30){ cov++; hit[cellOf[k]]++; } });
    for (let p = 0; p < mw * mh; p++) if (d[p * 4 + 3] > 30){ inkN++; if (!tol[p]) out++; }
    let partsN = 0, partsHit = 0;
    cells.forEach((n, c) => { if (n){ partsN++; if (hit[c] >= n / 3) partsHit++; } });
    return {coverage: mask.length ? cov / mask.length : 0, outside: inkN ? out / inkN : 0, inkN,
      spread: mask.length ? inkN / mask.length : 0, parts: partsN ? partsHit / partsN : 0, pen: travel / skelLen};
  }
  // Only a real trace passes: most of the letters covered, little ink off them, and no scribbling.
  // After two tries that were not quite enough, it is a little kinder, but never lets a scribble through.
  function check(pressed){
    if (won || !mask.length) return;
    const {coverage, outside, inkN, spread, parts, pen} = measure();
    if (window.__traceStats) window.__traceStats.push({coverage, outside, spread, parts, pen});   // test hook
    const kind = fails >= 2;
    const messy = kind ? outside > 0.25 || spread > 2.6 || (spread > 2 && outside > 0.1)
                       : outside > 0.2 || spread > 2.4 || (spread > 1.8 && outside > 0.08);
    const scribble = pen > (kind ? 2.8 : 2.2);   // tracing once is 0.8-1.4; going over a part again is fine
    const pass = !messy && !scribble && (kind ? coverage >= 0.5 && parts >= 0.72 : coverage >= 0.6 && parts >= 0.8);
    if (pass){ success(); return; }
    if (!pressed && !scribble) return;
    fails++; Sfx.bad(); wiggle(wrap);
    if (inkN === 0) say(SHOW.useFinger, T.useFinger);
    else if (scribble){ say(SHOW.noScribble, T.noScribble); clearInk(); }   // start that one again
    else if (messy){ say(SHOW.stayOn, T.stayOn); clearInk(); }
    else say(SHOW.keepGoing, T.keepGoing);
  }
  function success(){
    won = true; Sfx.good(); wrap.classList.add('win'); burst(wrap); drawGuide(true);
    const s = items[i];
    ctx.progress((i + 1) / items.length);
    const pr = pick(PRAISE);
    afterSay(say(pr, [pr, SND(s)]), 1300, () => { i++; if (i >= items.length) ctx.done(); else startItem(); });
  }
  function startItem(){
    won = false; fails = 0; wrap.classList.remove('win');
    const s = items[i], S = SOUND[s];
    topPic.textContent = S.pic; topLabel.textContent = s; topWord.replaceChildren(ruby(S.w, S.wp));
    counter.textContent = `${i + 1} / ${items.length}`;
    clearInk(); if (W) drawGuide();
    ctx.progress(i / items.length);
    const prompt = () => say(SHOW.traceLetter, [T.traceThis, S.say]);
    ctx.replay = prompt; prompt();
    quizHook('trace', s);
    if (window.__quiz) window.__pass = () => { if (!won) success(); };   // test hook
  }

  function seg(a, b){
    hue = (hue + 3) % 360;
    ictx.strokeStyle = `hsl(${hue}, 85%, 55%)`; ictx.lineWidth = brush; ictx.lineCap = 'round'; ictx.lineJoin = 'round';
    ictx.beginPath(); ictx.moveTo(a.x, a.y); ictx.lineTo(b.x, b.y); ictx.stroke();
  }
  onStrokes(ink, {
    down: p => { if (won || !ictx) return false; drawing = true; last = p; seg(p, {x:p.x + 0.1, y:p.y}); },
    move: p => { if (!drawing) return; travel += Math.hypot(p.x - last.x, p.y - last.y); seg(last, p); last = p; },
    up: () => { if (!drawing) return; drawing = false; check(false); },
  });
  const resized = () => { const r = wrap.getBoundingClientRect(); if (Math.round(r.width) !== W || Math.round(r.height) !== H) layout(); };
  const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load(font(100)), wait(2500)]) : Promise.resolve();
  fontReady.catch(() => {}).then(() => { if (!ctx.alive()) return; watchSize(wrap, resized); layout(); });
  startItem();
}

// 3 · 写汉字: watch the stroke order, then write the character stroke by stroke in a 田 grid (Hanzi Writer)
let hwLoading = null;
function loadHanziWriter(){
  if (window.HanziWriter) return Promise.resolve();
  if (!hwLoading) hwLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'js/hanzi-writer.min.js?v=3.7.3';
    s.onload = () => res(); s.onerror = () => { hwLoading = null; rej(new Error('load')); };
    document.head.append(s);
  });
  return hwLoading;
}
const hanziFile = c => 'hanzi/' + c.codePointAt(0).toString(16) + '.json';
function gridSvg(){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100'); svg.setAttribute('class', 'grid'); svg.setAttribute('aria-hidden', 'true');
  const line = (x1, y1, x2, y2, dash, w = 0.6) => {
    const ln = document.createElementNS(NS, 'line');
    Object.entries({x1, y1, x2, y2, stroke:'#f2b8ae', 'stroke-width':w, 'stroke-dasharray':dash || ''}).forEach(([k, v]) => ln.setAttribute(k, v));
    svg.append(ln);
  };
  line(2, 2, 98, 2, '', 1.4); line(98, 2, 98, 98, '', 1.4); line(98, 98, 2, 98, '', 1.4); line(2, 98, 2, 2, '', 1.4);
  line(50, 2, 50, 98, '2.5 2'); line(2, 50, 98, 50, '2.5 2');
  line(2, 2, 98, 98, '1.5 2.5', 0.4); line(98, 2, 2, 98, '1.5 2.5', 0.4);
  return svg;
}
function actWrite(ctx){
  const l = ctx.lesson, items = l.write.slice(0, isShort() ? 2 : 4);
  let i = 0, writer = null, size = 0, quizzing = false, said = false;
  const box = h('div', {class:'grid-box'}), target = h('div', {class:'hw'});
  box.append(gridSvg(), target);
  const topRuby = h('span'), topWord = h('span', {class:'han'}), counter = h('span', {class:'count'});
  const dots = h('div', {class:'stroke-dots', 'aria-hidden':'true'});
  const watchBtn = h('button', {class:'btn blue', onclick:() => { Sfx.tap(); demo(); }}, '👀 看笔顺');
  const againBtn = h('button', {class:'btn orange', onclick:() => { Sfx.tap(); startQuiz(); }}, '🧽 重写');
  const skipBtn = h('button', {class:'btn white', hidden:true, onclick:() => { Sfx.tap(); next(); }}, '下一个 ➜');
  ctx.stage.replaceChildren(h('div', {class:'write-top'}, topRuby, topWord, counter), box, dots, h('div', {class:'row'}, watchBtn, againBtn, skipBtn));
  ctx.progress(0);
  const loading = h('div', {class:'loading'}, '……');
  box.append(loading);

  const info = c => charOf(l, c) || CHAR_INFO[c] || [c, '', '', '', ''];
  const sz = () => Math.round(box.getBoundingClientRect().width) || 300;
  function make(c){
    size = sz();
    target.replaceChildren();
    writer = window.HanziWriter.create(target, c, {
      width:size, height:size, padding:Math.round(size * 0.08),
      showOutline:true, showCharacter:false,
      strokeColor:'#3a2440', outlineColor:'#eedfdb', drawingColor:'#e8453c', highlightColor:'#ffb84d', radicalColor:null,
      drawingWidth:Math.max(10, Math.round(size * 0.045)), strokeAnimationSpeed:1, delayBetweenStrokes:250,
      charDataLoader:(ch, onLoad, onError) => { fetch(hanziFile(ch)).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(onLoad, onError); },
      onLoadCharDataSuccess:d => { loading.hidden = true; dots.replaceChildren(...d.strokes.map(() => h('i'))); },
      onLoadCharDataError:() => { loading.hidden = false; loading.textContent = '⚠️ 笔顺数据没有加载'; skipBtn.hidden = false; },
    });
  }
  function demo(){
    if (!writer) return;
    quizzing = false;
    try { writer.cancelQuiz(); } catch (e) {}
    const x = info(items[i]);
    say(SHOW.watchStrokes, [T.watchStrokes, charSay(x)]);
    writer.hideCharacter();
    writer.animateCharacter({onComplete:res => { if (!res || !res.canceled) later(startQuiz, 500); }});
  }
  function startQuiz(){
    if (!writer || !ctx.alive()) return;
    quizzing = true; said = false;
    box.classList.remove('win');
    [...dots.children].forEach(d => d.classList.remove('on'));
    writer.hideCharacter();
    say(SHOW.writeNow, T.writeNow);
    quizHook('write', items[i]);
    if (window.__quiz) window.__pass = () => { if (quizzing){ quizzing = false; try { writer.cancelQuiz(); } catch (e) {} success(); } };   // test hook
    writer.quiz({
      leniency:1.4, showHintAfterMisses:2, markStrokeCorrectAfterMisses:4, acceptBackwardsStrokes:false,
      onCorrectStroke:d => { Sfx.stroke(); const dot = dots.children[d.strokeNum]; if (dot) dot.classList.add('on'); },
      onMistake:d => { Sfx.bad(); if (!said && d.mistakesOnStroke === 1){ said = true; say(T.strokeTry); } },
      onComplete:() => { quizzing = false; success(); },
    });
  }
  function success(){
    Sfx.good(); box.classList.add('win'); burst(box);
    ctx.progress((i + 1) / items.length);
    const x = info(items[i]), pr = pick(PRAISE);
    afterSay(say(pr, [pr, charSay(x)]), 1300, next);
  }
  function next(){ i++; if (i >= items.length) ctx.done(); else startItem(); }
  function startItem(){
    const c = items[i], x = info(c);
    box.classList.remove('win'); skipBtn.hidden = true; loading.hidden = false; loading.textContent = '……';
    topRuby.replaceChildren(rubyEl([[c, x[1]]]));
    topWord.textContent = x[2] ? `${x[2]}` : '';
    counter.textContent = `${i + 1} / ${items.length}`;
    ctx.progress(i / items.length);
    make(c);
    ctx.replay = demo;
    later(demo, 350);
  }
  watchSize(box, () => { if (writer && Math.abs(sz() - size) > 4){ size = sz(); writer.updateDimensions({width:size, height:size, padding:Math.round(size * 0.08)}); } });
  cleanups.push(() => { try { if (writer) writer.cancelQuiz(); } catch (e) {} });
  loadHanziWriter().then(() => { if (ctx.alive()) startItem(); }).catch(() => {
    loading.textContent = '⚠️ 写字工具没有加载，请检查网络后再试。'; skipBtn.hidden = false;
    skipBtn.onclick = () => { Sfx.tap(); ctx.done(); };
  });
}

// 4 · 拼一拼: put the initial and the final together (b + ā → bā), then build syllables you hear
// syllables a lesson can blend: not read as a whole (zhi, yi), and with an initial
const blendSyls = l => uniq((l.syll || []).map(x => x[0])).filter(s => { const p = splitSyl(s); return p.ini && !p.whole; });
const sylInfo = (l, s) => (l.syll || []).find(x => x[0] === s) || sylsUpTo(l.n).find(x => x[0] === s) || [s, '', ''];
// the coloured parts of a syllable as tiles: [kind, text shown, what 乐乐 says]
function blendParts(s){
  const {ini, med, fin} = splitSyl(s);
  return [['i', ini, SND(ini)], ...(med ? [['m', med, SOUND[med].say]] : []), ['f', fin, fin]];
}
function actBlend(ctx){
  const l = ctx.lesson, syls = blendSyls(l);
  const learn = shuffle(syls).slice(0, isShort() ? 2 : 3);
  const quiz = roundList(syls, isShort() ? 3 : 5, isShort() ? 3 : 5);
  const total = learn.length + quiz.length;
  let i = 0;
  const step = () => {
    if (i >= learn.length){ build(0); return; }
    ctx.progress(i / total);
    const s = learn[i], [, ch, pic] = sylInfo(l, s), parts = blendParts(s);
    const tiles = parts.map(([k, txt, sound]) => h('button', {class:'bpart ' + k, onclick:e => { Sfx.tap(); bounce(e.currentTarget); Speech.speak(sound); }}, txt));
    const res = h('div', {class:'bres'}, s);
    const picEl = h('div', {class:'blend-pic'});
    const nextBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); i++; step(); }}, '下一个 ➜');
    let busy = false, joined = false;
    const join = async () => {
      if (busy) return; busy = true;
      const id = navId;
      for (let k = 0; k < tiles.length; k++){
        if (id !== navId) return;
        tiles[k].classList.add('hint'); Sfx.tick(k);
        await Speech.speak(parts[k][2]);
        tiles[k].classList.remove('hint');
        await wait(120);
      }
      if (id !== navId) return;
      res.classList.add('full'); Sfx.good();
      picEl.replaceChildren(pic || '', ch ? h('span', {class:'han'}, ch) : '');
      await Speech.speak(s);
      busy = false;
      if (!joined){ joined = true; reveal(nextBtn); }
    };
    const joinBtn = h('button', {class:'btn pink big', onclick:() => { Sfx.tap(); join(); }}, '🧩 拼！');
    const eq = [];
    tiles.forEach((t, k) => { if (k) eq.push(h('span', {class:'op'}, '+')); eq.push(t); });
    eq.push(h('span', {class:'op'}, '→'), res);
    ctx.stage.replaceChildren(h('div', {class:'blend-box'}, h('div', {class:'blend-eq'}, eq), picEl, h('div', {class:'row'}, joinBtn)), nextBtn);
    const intro = () => say(T.blendTap + ' 🧩', i === 0 ? [T.blendRhyme, T.blendTap] : [T.blendTap]);
    ctx.replay = join; intro();
  };
  // build: hear a syllable, tap its parts in order; later rounds add the same final with another tone
  const build = r => {
    if (r >= quiz.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((learn.length + r) / total);
    const s = quiz[r], [, ch, pic] = sylInfo(l, s), parts = blendParts(s);
    const {ini, med, fin, finBase, tone} = splitSyl(s);
    const iniOpts = uniq([ini, ...shuffle((LOOK_PY[ini] || '').split(' ').filter(x => x && SOUND[x])), ...shuffle(l.sounds.filter(isInitial)), ...shuffle(INITIALS)])
      .filter(x => x === ini || x !== 'y' && x !== 'w' || 'yw'.includes(ini)).slice(0, hard(r) ? 3 : 2);
    const finOpts = uniq([fin,
      ...(hard(r) ? [withTone(finBase, pick([1, 2, 3, 4].filter(t => t !== tone)))] : []),
      ...shuffle(uniq(blendSyls(l).map(x => splitSyl(x).fin)).filter(f => plain(f) !== finBase))]).slice(0, hard(r) ? 3 : 2);
    const medOpts = med ? uniq([med, ...shuffle(['i', 'u', 'ü'].filter(x => x !== med))]).slice(0, 2) : [];
    const want = parts.map(p => p[1]);
    let pos = 0, misses = 0, solved = false;
    const slots = parts.map(([k]) => h('div', {class:'slot'}));
    const slotRow = h('div', {class:'slots'}, slots.flatMap((sl, k) => k ? [h('span', {class:'op'}, '+'), sl] : [sl]));
    const picEl = h('div', {class:'spell-pic'}, '👂');
    const prompt = () => say(SHOW.blendBuild, [T.blendBuild, s]);
    quizHook('blend', s, want);
    const tileOf = (txt, kind) => {
      const t = h('button', {class:'tile ' + kind, 'data-v':txt, onclick:e => {
        if (solved || t.classList.contains('used') || !tapOK(e)) return;
        if (txt === want[pos]){
          t.classList.add('used'); slots[pos].textContent = txt; slots[pos].classList.add('filled');
          Speech.speak(parts[pos][2]);
          pos++; misses = 0; Sfx.tick(pos);
          tiles.forEach(x => x.classList.remove('hint'));
          if (pos === want.length){
            solved = true; Sfx.good(); burst(slotRow); fadeOthers(tiles, null);
            picEl.replaceChildren(pic || '⭐', ch ? h('span', {class:'han', style:{fontSize:'.8em'}}, ' ' + ch) : '');
            ctx.progress((learn.length + r + 1) / total);
            const pr = pick(PRAISE);
            afterSay(say(pr, [pr, ...sylSpeech(s)]), 1400, () => build(r + 1));
          }
        } else {
          misses++; Sfx.bad(); wiggle(t);
          if (misses === 1) Speech.speak(s);
          if (misses >= 2){ const hint = tiles.find(x => !x.classList.contains('used') && x.textContent === want[pos]); if (hint) hint.classList.add('hint'); }
        }
      }}, txt);
      return t;
    };
    const tiles = [...shuffle(iniOpts).map(x => tileOf(x, 'init')), ...shuffle(medOpts).map(x => tileOf(x, 'fin')), ...shuffle(finOpts).map(x => tileOf(x, 'fin'))];
    ctx.stage.replaceChildren(h('div', {class:'row'}, listenBtn(prompt), picEl), slotRow, h('div', {class:'tiles'}, tiles));
    ctx.replay = prompt; prompt();
  };
  step();
}

// 5 · 读一读 (pinyin lessons): sound out syllable cards, then listen & choose
function sylEl(s){
  return h('span', {class:'syl'}, sylParts(s).map(([k, txt]) => h('span', {class:'pt ' + k}, txt)));
}
async function soundOutSyl(el, s){
  const id = navId;
  const pts = [...el.querySelectorAll('.pt')], sp = sylSpeech(s);
  if (pts.length > 1){
    for (let k = 0; k < pts.length; k++){
      if (id !== navId) return;
      pts[k].classList.add('lit'); Sfx.tick(k);
      await Speech.speak(sp[k]);
      pts[k].classList.remove('lit');
    }
  }
  if (id !== navId) return;
  el.classList.add('whole');
  await Speech.speak(s);
  el.classList.remove('whole');
}
// wrong syllables: the same letters with another tone (later rounds), the lesson's other syllables, then earlier ones
function sylChoices(target, l, r, ok = () => true){
  const n = hard(r) ? 4 : 3, base = plain(target), t = toneOf(target);
  const bad = s => s === target || !ok(s);
  const look = hard(r) ? [withTone(base, pick([1, 2, 3, 4].filter(x => x !== t)))].filter(s => !bad(s)) : [];
  const rest = uniq([...shuffle(l.syll.map(x => x[0])), ...shuffle(sylsUpTo(l.n).map(x => x[0]))]).filter(s => !bad(s) && !look.includes(s) && plain(s) !== base);
  return shuffle([target, ...look, ...rest].slice(0, n));
}
function actRead(ctx){
  const l = ctx.lesson, items = l.syll;
  const quiz = isShort() ? roundList(items, 3, 3) : roundList(items, 5, 6);
  const total = quiz.length + 1, seen = new Set();
  const playBtn = h('button', {class:'btn green big', hidden:true, onclick:() => { Sfx.tap(); round(0); }}, '🎮 开始 ➜');
  const cards = items.map(([s, ch, pic]) => {
    const se = sylEl(s);
    let busy = false;
    const card = h('button', {class:'word-card', 'aria-label':s, onclick:async () => {
        if (busy) return; busy = true; Sfx.tap();
        await soundOutSyl(se, s);
        // zhi, zi, yi …: say that it is read as a whole
        if (splitSyl(s).whole && plain(s).length > 1 && ctx.alive()) await say(`${s}：整体认读音节`, T.wholeRead);
        busy = false;
        if (!ctx.alive()) return;
        card.classList.add('seen'); seen.add(s);
        if (seen.size === uniq(items.map(x => x[0])).length) reveal(playBtn);
      }},
      se, h('span', {class:'wpic'}, pic), h('span', {class:'wz'}, ch));
    return card;
  });
  ctx.stage.replaceChildren(h('div', {class:'cards'}, cards), playBtn);
  ctx.progress(0);
  const intro = () => say(SHOW.soundOut, T.soundOut);
  ctx.replay = intro; intro();

  const plan = typePlan(quiz.length, ['hear', 'pic', 'missing']);
  function round(r){
    if (r >= quiz.length){ ctx.progress(1); later(ctx.done, 300); return; }
    ctx.progress((r + 1) / total);
    const [s, ch, pic] = quiz[r];
    let type = plan[r];
    const parts = sylParts(s);
    if (type === 'missing' && parts.length < 2) type = pic ? 'pic' : 'hear';
    const picShow = h('div', {class:'quiz-pic' + (type === 'hear' ? '' : ' show')}, pic || '⭐');
    let solved = false, misses = 0, prompt, body;
    const win = (el, all, then) => {
      solved = true; el.classList.add('right'); Sfx.good(); burst(el); picShow.classList.add('show'); fadeOthers(all, el);
      if (then) then();
      ctx.progress((r + 2) / total);
      const pr = pick(PRAISE);
      afterSay(say(pr, [pr, s]), 1200, () => round(r + 1));
    };
    if (type === 'missing'){
      // one part is missing (the initial or the final); the choices are parts
      const k = Math.random() < 0.5 ? 0 : parts.length - 1, want = parts[k][1];
      const gap = h('span', {class:'gap-box'}, want);
      const shown = h('span', {class:'syl'}, parts.map(([kind, txt], j) => j === k ? gap : h('span', {class:'pt ' + kind}, txt)));
      const pool = parts[k][0] === 'i'
        ? uniq([...shuffle((LOOK_PY[want] || '').split(' ').filter(Boolean)), ...shuffle(l.sounds.filter(isInitial)), ...shuffle(INITIALS)])
        : uniq([...shuffle(items.map(x => sylParts(x[0]).slice(-1)[0][1])), withTone(plain(want), pick([1, 2, 3, 4].filter(t => t !== toneOf(want))))]);
      const opts = shuffle([want, ...pool.filter(x => x !== want && x).slice(0, hard(r) ? 2 : 1)]);
      prompt = () => say(SHOW.missingPart, [T.missingPart, s]);
      const btns = opts.map(x => {
        const b = h('button', {class:'tile ' + (parts[k][0] === 'i' ? 'init' : 'fin'), 'data-v':x, onclick:e => {
          if (solved || !tapOK(e)) return;
          if (x === want) win(b, btns, () => { gap.classList.add('found'); });
          else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), [T.missingPart, s]);
            if (misses >= 2) btns[opts.indexOf(want)].classList.add('hint');
          }
        }}, x);
        return b;
      });
      quizHook(type, want);
      body = [h('div', {class:'miss-word'}, shown), h('div', {class:'tiles'}, btns)];
    } else {
      if (type === 'pic' && !pic) type = 'hear';
      const picOK = x => { const it = sylsUpTo(l.n).find(y => y[0] === x); return !it || it[2] !== pic; };
      const opts = sylChoices(s, l, r, type === 'pic' ? picOK : undefined);
      prompt = type === 'pic' ? () => say(SHOW.picSyl, T.picSyl) : () => say(SHOW.popBalloon, [T.find, s]);
      const btns = opts.map(x => {
        const b = h('button', {class:'choice', 'data-v':x, onclick:e => {
          if (solved || !tapOK(e)) return;
          if (x === s) win(b, btns);
          else {
            misses++; Sfx.bad(); wiggle(b);
            say(pick(TRY), type === 'pic' ? [x, T.picSyl] : [x, T.find, s]);
            if (misses >= 2) btns[opts.indexOf(s)].classList.add('hint');
          }
        }}, x);
        return b;
      });
      quizHook(type, s);
      body = [h('div', {class:'choices'}, btns)];
    }
    ctx.stage.replaceChildren(listenBtn(prompt), picShow, ...body);
    ctx.replay = prompt; prompt();
  }
}

// 5 · 读词语 (character lessons): read the word cards, then listen & choose
function wordEl(w, py){ return ruby(w, py); }
async function readWordOut(el, w, py){
  const id = navId;
  const rbs = [...el.querySelectorAll('.rb')];
  const syl = py.split(' ');
  if (rbs.length > 1){
    for (let k = 0; k < rbs.length; k++){
      if (id !== navId) return;
      rbs[k].classList.add('lit'); Sfx.tick(k);
      await Speech.speak(syl[k]);
      rbs[k].classList.remove('lit');
    }
  }
  if (id !== navId) return;
  el.classList.add('whole');
  await Speech.speak(wordSay(w, py));
  el.classList.remove('whole');
}
// wrong words: words sharing a character (later rounds), the lesson's other words, then earlier ones
function wordChoices(target, l, r, ok = () => true){
  const n = hard(r) ? 4 : 3;
  const pool = uniq([...l.words, ...LESSONS.filter(x => x.n < l.n && x.words).flatMap(x => x.words)].map(x => x[0]));

    const r = wrap.getBoundingClientRect();
    if (!r.width || !r.height) return;
    const old = c2d && cv.width ? (() => { const t = document.createElement('canvas'); t.width = cv.width; t.height = cv.height; t.getContext('2d').drawImage(cv, 0, 0); return t; })() : null;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(r.width); H = Math.round(r.height);
    cv.width = W * dpr; cv.height = H * dpr;
    c2d = cv.getContext('2d');
    paintWhite();
    if (old) c2d.drawImage(old, 0, 0, cv.width, cv.height);
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    history.length = 0;
    placeLabel();
  }
  function seg(a, b){
    c2d.strokeStyle = erasing ? '#fff' : color; c2d.lineWidth = erasing ? size * 2 : size;
    c2d.lineCap = 'round'; c2d.lineJoin = 'round';
    c2d.beginPath(); c2d.moveTo(a.x, a.y); c2d.lineTo(b.x, b.y); c2d.stroke();
  }
  onStrokes(cv, {
    down: p => { if (!c2d) return false; pushHistory(); drawing = true; last = p; seg(p, {x:p.x + 0.1, y:p.y}); if (!erasing) hasInk = true; },
    move: p => { if (!drawing) return; seg(last, p); last = p; },
    up: () => { drawing = false; },
  });
  function roundRect(o, x, y, w, ht, r){
    o.beginPath(); o.moveTo(x + r, y);
    o.arcTo(x + w, y, x + w, y + ht, r); o.arcTo(x + w, y + ht, x, y + ht, r);
    o.arcTo(x, y + ht, x, y, r); o.arcTo(x, y, x + w, y, r); o.closePath();
  }
  function savePicture(){
    // the word label is saved where it sits on the picture
    const out = document.createElement('canvas');
    out.width = cv.width; out.height = cv.height;
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    const c = placeLabel();
    if (c){
      const r = wrap.getBoundingClientRect(), sx = cv.width / r.width, sy = cv.height / r.height;
      const lw = labelEl.offsetWidth * sx, lh = labelEl.offsetHeight * sy, x = c.x * sx, y = c.y * sy;
      o.fillStyle = 'rgba(255,255,255,.85)'; roundRect(o, x - lw / 2, y - lh / 2, lw, lh, 14 * sy); o.fill();
      const fs = parseFloat(getComputedStyle(labelText).fontSize) || 32;
      o.fillStyle = '#b72a23'; o.textAlign = 'center'; o.textBaseline = 'middle';
      o.font = `${Math.round(fs * sy)}px ZhKai, 'Kaiti SC', KaiTi, serif`;
      o.fillText(labelText.textContent, x, y);
    }
    out.toBlob(blob => {
      if (!blob) return;
      const a = h('a', {href:URL.createObjectURL(blob), download:`zhongwen-${l.n}-${label ? label.w : 'picture'}.png`});
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }, 'image/png');
  }
  watchSize(wrap, () => { const r = wrap.getBoundingClientRect(); if (Math.round(r.width) !== W || Math.round(r.height) !== H) layout(); });
  layout();
}

/* ---------- version ---------- */
const versionText = () => `版本 ${APP_VERSION.n} · ${APP_VERSION.date}`;
// Shown on the home and parents screens when the server has a newer version than this page.
const updateSlot = h('div', {class:'update-slot', role:'status'});
let lastCheck = 0;
function checkUpdate(){
  if (!window.fetch || Date.now() - lastCheck < 10 * 60 * 1000) return;   // at most every 10 minutes
  lastCheck = Date.now();
  fetch('index.html?check=' + Date.now(), {cache:'no-store'}).then(r => r.ok ? r.text() : '').then(t => {
    const m = /var APP_VERSION = \{n:(\d+), date:'([^']*)'\}/.exec(t);
    if (m && +m[1] > APP_VERSION.n) updateSlot.replaceChildren(
      h('button', {class:'btn orange', onclick:() => forceRefresh()}, `🔄 新版本 ${m[1]} 来啦，点这里更新！`));
  }).catch(() => {});
}

/* ---------- force refresh ---------- */
async function forceRefresh(){
  Speech.stop();
  overlay([h('div', {class:'big-star'}, '🔄'), h('h1', {}, '正在更新……'), h('p', {}, '正在获取最新版本')]);
  const base = location.pathname.replace(/[^/]*$/, '');
  const urls = [location.pathname, base + 'index.html', base + 'audio/manifest.js', base + 'fonts/kai.woff2', base + 'fonts/andika-700.woff2'];
  try {
    if (window.caches) for (const k of await caches.keys()) await caches.delete(k);
    await Promise.race([Promise.all(urls.map(u => fetch(u, {cache:'reload'}).catch(() => {}))), wait(6000)]);
  } catch (e) {}
  location.replace(location.pathname + '?v=' + Date.now() + location.hash);
}

/* =====================================================================
   PHRASES — every line 乐乐 can say (tools/build_audio.py records these)
   A phrase in pinyin (bā) is one syllable, recorded with exactly that tone.
   phrasePinyin() gives the reading of every lesson text, so polyphones (长, 了, 地) are read right.
   ===================================================================== */
const ACT_NAMES = uniq(LESSONS.flatMap(l => actsOf(l).map(a => actName(l, a))));
function globalPhrases(){
  return uniq([
    ...Object.values(T), ...PRAISE, ...TRY,
    ...Object.values(SOUND).flatMap(S => [S.say, S.ph]),
    ...DRAW_COLORS.map(c => c[0]),
    ...ACT_NAMES.map(P.playAct),
    ...LESSONS.map((l, k) => P.haveStickers(k + 1)),
  ].map(norm).filter(Boolean));
}
// pinyin of every Han character in a phrase list item, as [phrase, pinyin]
function lessonTexts(l){
  const out = [];
  const add = (t, py) => out.push([norm(t), py]);
  for (const s of (l.sounds || [])) add(SOUND[s].ph, SOUND[s].php);
  for (const x of (l.chars || [])) add(charSay(x), charSayPy(x));
  for (const [w, py] of (l.words || [])) add(w, py);
  for (const [text, py] of l.sentences){
    add(cleanText(text), py);
    for (const tok of parseText(text, py)) if (tok.chars.filter(([c]) => isHan(c)).length > 1) add(tok.word, tokPy(tok));
  }
  return out;
}
function lessonSyllables(l){
  const out = [];
  for (const s of (l.sounds || [])) out.push(SND(s));
  for (const [s] of (l.syll || [])){
    out.push(...sylSpeech(s));
    for (let t = 1; t <= 4; t++) out.push(withTone(plain(s), t));
  }
  for (const it of (l.n >= 5 ? toneItems(l) : [])) for (let t = 1; t <= 4; t++) out.push(withTone(it.base, t));
  for (const x of (l.chars || [])) out.push(x[1]);
  for (const [, py] of (l.words || [])) out.push(...py.split(' '));
  for (const [text, py] of l.sentences) for (const tok of parseText(text, py)) if (tok.chars.filter(([c]) => isHan(c)).length === 1) out.push(tokPy(tok));
  for (const [s] of (l.syll || [])) out.push(s);
  return out;
}
function lessonPhrases(l){
  const name = STICKERS[l.n - 1][1];
  return uniq([
    P.lesson(l.n), P.playLesson(l.n), P.finished(l.n), P.gotSticker(name), P.aSticker(name), P.finishFor(l.n),
    ...actsOf(l).map(a => P.playAct(actName(l, a))),
    ...lessonTexts(l).map(([t]) => t),
    ...lessonSyllables(l),
  ].map(norm).filter(Boolean));
}
const allPhrases = () => uniq([...globalPhrases(), ...LESSONS.flatMap(lessonPhrases)]);
function phrasePinyin(){
  const out = {};
  for (const S of Object.values(SOUND)) out[norm(S.ph)] = S.php;
  for (const l of LESSONS) for (const [t, py] of lessonTexts(l)){
    if (out[t] && out[t] !== py) console.warn('two readings for', t, out[t], py);
    out[t] = out[t] || py;
  }
  return out;
}
window.__zhPhrases = allPhrases;
window.__zhPinyin = phrasePinyin;
window.__zhHan = () => uniq([...document.documentElement.innerHTML].filter(isHan)).join('');
window.__zhActs = n => actsOf(LESSON_BY_N[n]).map(a => a.key);

/* =====================================================================
   START
   ===================================================================== */
Speech.init();
// Browsers only allow sound after a tap. The first tap turns it on (pages opened without the start
// screen), and a tap after iOS blocked audio (a call, time in the background) turns it back on.
// Only these events count as a tap for that: pointerdown does not for touch.
const activateAudio = () => {
  if (!audioUnlocked){
    audioUnlocked = true; Speech.unlock(); Sfx.ensure();
    Speech.preload([...Object.values(T), ...PRAISE, ...TRY]);
  } else if (Speech.blocked){ Speech.blocked = false; Speech.unlock(); Sfx.ensure(); }
  else Sfx.ensure();   // resumes the audio if the phone paused it
  Music.start();       // no-op when it is already playing or switched off
};
['pointerup', 'touchend', 'click', 'keydown'].forEach(t => document.addEventListener(t, activateAudio, true));
// No zooming (with the viewport tag and touch-action): iOS Safari ignores user-scalable=no, so its pinch is stopped
// here (gesture events, moves with two fingers); a trackpad pinch on a computer is a wheel event with ctrlKey, like
// Ctrl + mouse wheel. Ctrl/⌘ + and − on the keyboard still zoom, for grown-ups who need bigger text.
['gesturestart', 'gesturechange'].forEach(t => document.addEventListener(t, e => e.preventDefault()));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
window.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, {passive:false});
if (/[?&]v=\d+/.test(location.search)) try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden){ Speech.stop(); Music.stop(); } else { Music.start(); checkUpdate(); } });
route();
if (!/^#\/(parents|start)/.test(location.hash)) showStart();   // #/start shows it via route()
checkUpdate();
})();
</script>
